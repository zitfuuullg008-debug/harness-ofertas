# Coleta diária na Biblioteca de Anúncios da Meta, rodando no GitHub Actions
# (internet aberta + proxy residencial). Comita data/raw/<data>/ no repositório;
# a rotina do Claude na nuvem lê daí, classifica e publica o relatório.
#
# Segredo necessário (Settings → Secrets and variables → Actions):
#   PROXY_URL = http://usuario:senha@gate.decodo.com:7000   (proxy residencial)
name: Minerar ofertas

on:
  # PAUSADO em 2026-09-22 a pedido do usuário: o proxy residencial é pago por GB
  # e o saldo acabou. Reativar descomentando as 2 linhas abaixo.
  # schedule:
  #   - cron: "0 8 * * *" # 05:00 em Brasília — a rotina do Claude roda às 06:00
  workflow_dispatch:
    inputs:
      nichos:
        description: "Nichos (ids separados por vírgula). Vazio = todos."
        default: ""
      max:
        description: "Anúncios por keyword"
        default: "20"
      enrich:
        description: "Páginas visitadas por nicho"
        default: "3"
      top:
        description: "Ofertas por nicho no resumo"
        default: "8"
      proxy:
        description: "Usar o proxy residencial? (sim/nao)"
        default: "sim"
      todos:
        description: "Ignorar o rodízio e rodar os 7 nichos? (sim/nao)"
        default: "nao"

permissions:
  contents: write

concurrency:
  group: minerar
  cancel-in-progress: false

jobs:
  minerar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependências + Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Diagnóstico de rede
        env:
          PROXY_RAW: ${{ secrets.PROXY_URL }}
          USAR_PROXY: ${{ inputs.proxy }}
        run: |
          P=$(printf '%s' "$PROXY_RAW" | tr -d '"\r\n ' | sed 's/^PROXY_URL=//; s#^https://#http://#')
          if [ "${USAR_PROXY:-sim}" = "nao" ]; then
            echo "proxy desativado nesta rodada (input proxy=nao)"
            echo "PROXY_URL_NORM=" >> "$GITHUB_ENV"
          else
            echo "PROXY_URL_NORM=$P" >> "$GITHUB_ENV"
          fi
          # Formato do segredo, sem revelar credencial:
          echo "  tamanho=${#P}  esquema=$(printf '%s' "$P" | cut -d: -f1)  tem_arroba=$(case "$P" in *@*) echo sim;; *) echo NAO;; esac)"
          echo "  host_depois_do_@=$(printf '%s' "$P" | sed -E 's#.*@##')"
          printf 'IP direto (sem proxy): '; curl -s -m 20 https://api.ipify.org || echo falhou; echo
          printf 'Meta SEM proxy:  '; curl -s -m 30 -o /dev/null -w '%{http_code}\n' -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36' 'https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=BR&q=receitas&search_type=keyword_unordered' || echo falhou
          if [ -n "$P" ]; then
            printf 'Proxy (erro detalhado): '; curl -s -m 30 -x "$P" -o /dev/null https://api.ipify.org 2>&1 | head -3 || true
            curl -sS -m 30 -x "$P" https://api.ipify.org 2>&1 | head -3 || true
          fi

      - name: Minerar
        env:
          PROXY_URL: ${{ env.PROXY_URL_NORM }}
        run: |
          set -o pipefail
          ARGS="--reaproveitar"
          [ -n "${{ inputs.nichos }}" ] && ARGS="$ARGS --nicho ${{ inputs.nichos }}"
          [ -n "${{ inputs.max }}" ]    && ARGS="$ARGS --max ${{ inputs.max }}"
          [ -n "${{ inputs.enrich }}" ] && ARGS="$ARGS --enrich ${{ inputs.enrich }}"
          [ -n "${{ inputs.top }}" ]    && ARGS="$ARGS --top ${{ inputs.top }}"
          [ "${{ inputs.todos }}" = "sim" ] && ARGS="$ARGS --todos"
          if [ -z "$PROXY_URL" ]; then echo "::warning::PROXY_URL não configurado — a Meta pode bloquear o IP do runner"; fi
          echo "node scripts/minerar.mjs $ARGS"
          node scripts/minerar.mjs $ARGS 2>&1 | tee minerar.log

      - name: Commit da coleta
        run: |
          HOJE=$(date -u +%Y-%m-%d)
          # Mantém só os últimos 10 dias de coleta bruta no repositório.
          find data/raw -mindepth 1 -maxdepth 1 -type d -mtime +10 -exec git rm -rq {} + 2>/dev/null || true
          git config user.name "harness-ofertas[bot]"
          git config user.email "bot@harness-ofertas"
          git add -f "data/raw/$HOJE" data/vistos.json
          if git diff --cached --quiet; then echo "nada novo pra commitar"; exit 0; fi
          RESUMO=$(node -e 'const r=require("./data/raw/'"$HOJE"'/resumo.json");console.log(r.nichos.map(n=>`${n.id}:${n.totalAnuncios}`).join(" "))' 2>/dev/null || echo "")
          git commit -m "coleta $HOJE: $RESUMO"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Log da coleta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minerar-log
          path: minerar.log
          retention-days: 7
