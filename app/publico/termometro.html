<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Termômetro das Ofertas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Tema escuro fixo, a pedido: a pagina nao segue o tema do visualizador,
   entao todo fundo e toda cor sao pintados explicitamente. */
:root{
  color-scheme:dark;
  --bg:#0b0f14; --surface:#141b23; --surface-2:#1a222b; --surface-3:#212b35;
  --line:#232e39; --line-2:#2c3844; --line-strong:#3d4a58;
  --ink:#eef3f7; --ink-2:#9fadba; --ink-3:#6f7d8b;
  --accent:#3fb2bd; --accent-ink:#04211f; --accent-soft:#0e3033;
  --rev:#4295de;  --rev-soft:#132539;
  --inv:#c4802e;  --inv-soft:#312210;
  --pro:#22a56c;  --pro-soft:#0c2a1d;
  --roas:#22a56c; --roas-soft:#0c2a1d;
  --neg:#f2685a;  --neg-soft:#331512;
  --warn:#e0aa46; --warn-soft:#2c2210;
  --idle:#7f8d9b; --idle-soft:#1a222a;
  --fun-a:#3d6fe0; --fun-b:#e0518b;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:22px; --s6:30px; --s7:42px; --s8:60px;
  --r-xs:8px; --r-sm:10px; --r:14px;
  --sh-1:0 1px 2px rgba(0,0,0,.34);
  --sh-2:0 1px 2px rgba(0,0,0,.34), 0 10px 28px -16px rgba(0,0,0,.72);

  --mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  font-feature-settings:"tnum" 1;
}
.num,.mono{font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:0 var(--s5) var(--s8)}

/* ---------- barra superior ---------- */
.topbar{
  position:sticky; top:0; z-index:30;
  background:rgba(11,15,20,.86); backdrop-filter:saturate(140%) blur(12px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1280px;margin:0 auto;padding:var(--s3) var(--s5);display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.brand h1{margin:0;font-size:16px;font-weight:600;letter-spacing:-.022em;white-space:nowrap}
.brand .tagline{font-size:11.5px;color:var(--ink-3);font-weight:450;letter-spacing:-.005em;white-space:nowrap}
.controls{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
select,button,input{font-family:inherit}
.sel{
  appearance:none; height:36px; background:var(--surface-2); color:var(--ink);
  border:1px solid var(--line-2); border-radius:var(--r-sm);
  padding:0 32px 0 var(--s3); font-size:13px; font-weight:500; cursor:pointer;
  letter-spacing:-.005em; transition:border-color .15s ease, background .15s ease;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 16px) 52%, calc(100% - 12px) 52%;
  background-size:4px 4px,4px 4px; background-repeat:no-repeat;
}
.sel:hover{border-color:var(--line-strong);background-color:var(--surface-3)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;
  background:var(--accent);color:var(--accent-ink);border:1px solid transparent;
  border-radius:var(--r-sm);padding:0 var(--s4);font-size:13px;font-weight:600;
  letter-spacing:-.005em;cursor:pointer;transition:filter .15s ease, opacity .15s ease;
}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.5;cursor:progress}
.btn .ico{width:14px;height:14px;display:block}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--ink);height:32px;font-size:12.5px;padding:0 var(--s3)}
.btn.ghost:hover{border-color:var(--accent);filter:none}
.spinning{animation:spin 900ms linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.stamp{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap;letter-spacing:-.02em}
.stamp.fresh{color:var(--pro)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* micro-rotulo, usado com parcimonia */
.k{font-size:10px;font-weight:600;letter-spacing:.075em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- barras de saude ---------- */
.health{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s5)}
@media (max-width:700px){.health{grid-template-columns:1fr}}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4) var(--s5);box-shadow:var(--sh-1)}
.hcard .top{display:flex;align-items:center;gap:var(--s2);font-size:10px;font-weight:600;letter-spacing:.075em;text-transform:uppercase;color:var(--ink-3)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.dot.g{background:var(--pro)} .dot.r{background:var(--neg)}
.hcard .row{display:flex;align-items:baseline;gap:var(--s2);margin-top:var(--s2)}
.hcard .n{font-size:30px;font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.hcard.g .n{color:var(--pro)} .hcard.r .n{color:var(--neg)}
.hcard .of{font-size:12.5px;color:var(--ink-3)}
.hcard .pc{margin-left:auto;font-size:14px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.track{height:5px;border-radius:3px;background:var(--surface-3);margin-top:var(--s3);overflow:hidden}
.track i{display:block;height:100%;border-radius:3px;transition:width .35s ease}
.hcard.g .track i{background:var(--pro)} .hcard.r .track i{background:var(--neg)}

/* ---------- veredito ---------- */
.verdict{
  margin-top:var(--s3); padding:var(--s4) var(--s5);
  border-radius:var(--r); display:flex; align-items:baseline; gap:var(--s4); flex-wrap:wrap;
  border:1px solid var(--line); background:var(--surface); box-shadow:var(--sh-2);
  border-left:3px solid var(--idle);
}
.verdict.is-pos{border-left-color:var(--pro)}
.verdict.is-neg{border-left-color:var(--neg)}
.verdict .lead{font-size:13px;font-weight:500;color:var(--ink-2);letter-spacing:-.005em}
.verdict .big{font-size:34px;font-weight:600;letter-spacing:-.045em;font-variant-numeric:tabular-nums;line-height:1}
.verdict.is-pos .big{color:var(--pro)}
.verdict.is-neg .big{color:var(--neg)}

/* ---------- zonas ---------- */
.zone{display:flex;align-items:center;gap:var(--s4);margin:var(--s6) 0 var(--s4);flex-wrap:wrap}
.zone h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.028em;color:var(--ink);white-space:nowrap}
.zone .src{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:-.02em}
.zone .ln{flex:1;min-width:24px;height:1px;background:var(--line)}
.split{margin-top:var(--s8);border-top:1px solid var(--line)}
.filter{display:inline-flex;align-items:center;gap:var(--s2);font-size:12.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.filter input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}

/* ---------- cartoes de metrica ---------- */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:var(--s3)}
.mcard{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:var(--s4) var(--s5) var(--s2); box-shadow:var(--sh-1);
  border-top:2px solid var(--line-2);
}
.mcard.rev{border-top-color:var(--rev)} .mcard.inv{border-top-color:var(--inv)}
.mcard.pro{border-top-color:var(--pro)} .mcard.roas{border-top-color:var(--roas)}
.mcard .mk{display:flex;align-items:center;gap:var(--s2);font-size:10px;font-weight:600;letter-spacing:.075em;text-transform:uppercase;color:var(--ink-3)}
.mcard .mv{font-size:26px;font-weight:600;letter-spacing:-.04em;margin-top:var(--s2);font-variant-numeric:tabular-nums;line-height:1.1}
.mcard.rev .mv{color:var(--rev)} .mcard.inv .mv{color:var(--inv)}
.mcard.pro .mv{color:var(--pro)} .mcard.pro .mv.bad{color:var(--neg)} .mcard.roas .mv{color:var(--roas)}
.mi{width:22px;height:22px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.mi svg{width:12px;height:12px;display:block}
.mcard.rev .mi{background:var(--rev-soft);color:var(--rev)}
.mcard.inv .mi{background:var(--inv-soft);color:var(--inv)}
.mcard.pro .mi{background:var(--pro-soft);color:var(--pro)}
.mcard.roas .mi{background:var(--roas-soft);color:var(--roas)}

/* ---------- graficos ---------- */
.chartbox{position:relative;margin-top:var(--s3)}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.ax{font-family:var(--mono);font-size:9px;fill:var(--ink-3);letter-spacing:-.02em}
.gl{stroke:var(--line);stroke-width:1}
.zl{stroke:var(--line-strong);stroke-width:1;stroke-dasharray:3 3}
.tip{
  position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-140%);
  background:var(--ink);color:var(--bg);font-size:11px;font-weight:600;
  padding:5px 9px;border-radius:7px;white-space:nowrap;z-index:5;
  transition:opacity .12s ease;font-variant-numeric:tabular-nums;letter-spacing:-.01em;
}
.tip.on{opacity:1}
.chartnote{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);padding:var(--s2) 0}

/* ---------- funil ---------- */
.funnel{--cols:5}
.fn-row{display:grid;grid-template-columns:repeat(var(--cols),1fr);text-align:center}
.fn-top{margin-bottom:var(--s3)}
.fn-top span{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:-.01em}
.fn-shape{position:relative}
.fn-shape svg{display:block;width:100%;height:184px}
.fn-div{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--cols),1fr);pointer-events:none}
.fn-div i{border-left:1px solid rgba(255,255,255,.15)}
.fn-div i:first-child{border-left:0}
.fn-pcs{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  display:grid;grid-template-columns:repeat(var(--cols),1fr);text-align:center;pointer-events:none}
.fn-pcs span{font-size:14.5px;font-weight:700;color:#fff;letter-spacing:-.025em;
  font-variant-numeric:tabular-nums;text-shadow:0 1px 4px rgba(4,8,12,.75)}
.fn-bot{margin-top:var(--s3)}
.fn-bot span{font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.028em}
.fn-rate{margin-top:var(--s1)}
.fn-rate i{position:relative;display:block;min-height:15px}
.fn-rate i span{position:absolute;left:0;transform:translateX(-50%);white-space:nowrap;
  font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:-.02em}

/* ---------- grade de ofertas ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s3);align-items:stretch}
.ocard{
  position:relative;display:flex;flex-direction:column;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:0;cursor:pointer;font-family:inherit;color:inherit;box-shadow:var(--sh-1);overflow:hidden;
  transition:transform .16s cubic-bezier(.2,.7,.3,1), box-shadow .16s ease, border-color .16s ease;
}
.ocard:hover{transform:translateY(-2px);border-color:var(--line-strong);box-shadow:var(--sh-2)}
.ocard .bar{height:3px;width:100%;background:var(--idle)}
.ocard.is-pos .bar{background:var(--pro)}
.ocard.is-neg .bar{background:var(--neg)}
.ocard.is-warn .bar{background:var(--warn)}
.ocard .pad{padding:var(--s4) var(--s5) var(--s5);display:flex;flex-direction:column;gap:var(--s4);flex:1}
.oc-head{display:flex}
.oc-name{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:14px;font-weight:600;letter-spacing:-.02em;line-height:1.32;min-height:2.64em;color:var(--ink);
}
.badge{
  display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;background:var(--idle-soft);color:var(--idle);white-space:nowrap;
}
.is-pos .badge{background:var(--pro-soft);color:var(--pro)}
.is-neg .badge{background:var(--neg-soft);color:var(--neg)}
.is-warn .badge{background:var(--warn-soft);color:var(--warn)}
.oc-profit{display:block;background:var(--surface-2);border-radius:var(--r-sm);padding:var(--s3) var(--s4)}
.oc-profit .k{display:block;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.oc-profit .v{display:block;font-size:25px;font-weight:600;letter-spacing:-.045em;line-height:1.18;font-variant-numeric:tabular-nums;margin-top:3px}
.is-pos .oc-profit .v{color:var(--pro)}
.is-neg .oc-profit .v{color:var(--neg)}
.is-warn .oc-profit .v{color:var(--warn)}
.oc-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4) var(--s3)}
.kv{display:block}
.kv .k,.kv .v{display:block}
.kv .k{font-size:9.5px;font-weight:600;letter-spacing:.075em;text-transform:uppercase;color:var(--ink-3)}
.kv .v{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:2px;color:var(--ink)}
.kv .v.rev{color:var(--rev)} .kv .v.inv{color:var(--inv)}
.oc-go{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-top:auto;
  padding-top:var(--s3);border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);font-weight:500;
}
.ocard:hover .oc-go{color:var(--accent)}

/* ---------- detalhe ---------- */
.back{
  display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--ink-2);
  font-size:13px;font-weight:500;cursor:pointer;padding:var(--s2) 0;margin-top:var(--s4);
  transition:color .15s ease;
}
.back:hover{color:var(--accent)}
.dhead{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin:var(--s1) 0 var(--s5)}
.dhead h2{margin:0;font-size:24px;letter-spacing:-.035em;font-weight:600;line-height:1.2}
.subgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:var(--s3)}
.sub{background:var(--surface);padding:var(--s3) var(--s4)}
.sub .k{font-size:9.5px;font-weight:600;letter-spacing:.075em;text-transform:uppercase;color:var(--ink-3)}
.sub .v{font-size:16px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.025em}

.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);margin-top:var(--s4);overflow:hidden}
.block > h3{
  margin:0;padding:var(--s4) var(--s5);font-size:13.5px;font-weight:600;letter-spacing:-.02em;
  color:var(--ink);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:var(--s3);
}
.block > h3 .cnt{font-family:var(--mono);color:var(--ink-3);font-weight:400;font-size:11px;letter-spacing:-.02em}
.block .body{padding:var(--s4) var(--s5) var(--s5)}
.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{
  text-align:right;font-size:9.5px;font-weight:600;letter-spacing:.075em;text-transform:uppercase;
  color:var(--ink-3);padding:0 0 var(--s2) var(--s4);border-bottom:1px solid var(--line);white-space:nowrap;
}
table.t th:first-child{text-align:left;padding-left:0}
table.t td{padding:var(--s3) 0 var(--s3) var(--s4);border-bottom:1px solid var(--line);vertical-align:middle}
table.t td:first-child{padding-left:0}
table.t tbody tr:last-child td{border-bottom:0}
table.t td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:500;letter-spacing:-.03em}
.pos{color:var(--pro)} .negv{color:var(--neg)}
.pname{display:flex;align-items:center;gap:var(--s3);min-width:0}
.pname .pb{height:6px;border-radius:3px;background:var(--rev);flex:0 0 auto;min-width:3px;opacity:.9}
.pname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cname{display:flex;align-items:center;gap:var(--s3);min-width:0}
.cst{width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:var(--idle)}
.cst.on{background:var(--pro)} .cst.off{background:var(--ink-3)}
.cname b{font-weight:600;font-size:12.5px;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.cname small{display:block;color:var(--ink-3);font-size:10.5px;font-family:var(--mono);font-weight:400;letter-spacing:-.02em;margin-top:1px}
.roaspill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.roaspill.g{background:var(--pro-soft);color:var(--pro)}
.roaspill.w{background:var(--warn-soft);color:var(--warn)}
.roaspill.r{background:var(--neg-soft);color:var(--neg)}

/* ---------- estados ---------- */
.panel{margin-top:var(--s5);padding:var(--s6);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh-1)}
.panel h2{margin:0 0 var(--s2);font-size:17px;letter-spacing:-.025em;font-weight:600}
.panel p{margin:0 0 var(--s1);color:var(--ink-2);font-size:13.5px;max-width:62ch}
.skel{height:214px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.045),transparent);transform:translateX(-100%);animation:sweep 1.4s ease-in-out infinite}
@keyframes sweep{to{transform:translateX(100%)}}
.loading{padding:var(--s6) var(--s5);text-align:center;color:var(--ink-3);font-size:13px}
.err{padding:var(--s3) var(--s5);font-size:13px;color:var(--ink-2);background:var(--warn-soft);border-top:1px solid var(--line)}
.err b{color:var(--ink);font-weight:600}
.foot{margin-top:var(--s6);font-size:12px;color:var(--ink-3);line-height:1.6;max-width:80ch}
details.diag summary{cursor:pointer;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.06em;text-transform:uppercase;list-style:none}
details.diag summary::-webkit-details-marker{display:none}
details.diag summary::before{content:"▸ "} details.diag[open] summary::before{content:"▾ "}
table.dg{border-collapse:collapse;margin-top:var(--s3);font-family:var(--mono);font-size:11px;width:100%}
table.dg td{padding:var(--s1) var(--s3) var(--s1) 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top;word-break:break-word}
table.dg td:nth-child(4){font-size:10px;line-height:1.5}
table.dg .bad{color:var(--neg);font-weight:600} table.dg .good{color:var(--pro)}
@media (prefers-reduced-motion: reduce){.skel::after,.spinning{animation:none}*{transition:none!important}}
@media (max-width:640px){
  .wrap{padding:0 var(--s4) var(--s7)}
  .topbar-in{padding:var(--s3) var(--s4)}
  .verdict{padding:var(--s4) var(--s5)}
  .verdict .big{font-size:32px}
  .dhead h2{font-size:20px}
}
</style>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <h1>Termômetro das Ofertas</h1>
      <div class="tagline">Lucro e prejuízo por oferta · Utmify · dados no seu PC</div>
    </div>
    <div class="controls">
      <select class="sel" id="period" aria-label="Período">
        <option value="today">Hoje</option>
        <option value="yesterday">Ontem</option>
        <option value="7d">Últimos 7 dias</option>
        <option value="30d">Últimos 30 dias</option>
        <option value="month">Este mês</option>
        <option value="lastmonth">Mês passado</option>
      </select>
      <select class="sel" id="sort" aria-label="Ordenação">
        <option value="profit">Maior lucro</option>
        <option value="loss">Maior prejuízo</option>
        <option value="revenue">Maior faturamento</option>
        <option value="roas">Maior ROAS</option>
        <option value="spend">Maior investimento</option>
      </select>
      <button class="btn" id="refresh">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 8a6 6 0 1 1-1.8-4.3"/><path d="M14 1.5V5h-3.5"/></svg>
        Atualizar
      </button>
      <span class="stamp" id="stamp">—</span>
    </div>
  </div>
</div>

<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";

  var SERVER = "Utmify";
  var T_LIST = "get_dashboards";
  var T_SUM = "get_dashboard_summary";
  var T_ADS = "get_meta_ad_objects";

  var state = {
    mcp: null, period: "today", sort: "profit", onlyLoss: false,
    view: "list", detailId: null,
    currency: "BRL", dashboards: null, rows: [],
    stampedAt: null, loading: false, pageError: null, diag: [], range: null, pulse: false,
    series: {}, campaigns: {}, overview: null, geralDash: null
  };
  var CHARTS = {};

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function num(v) { var n = Number(v); return isFinite(n) ? n : NaN; }
  function orNull(v) { var n = Number(v); return isFinite(n) ? n : null; }
  function pick() { for (var i = 0; i < arguments.length; i++) { var n = num(arguments[i]); if (isFinite(n)) return n; } return 0; }

  /* ---------------- formatação ---------------- */
  function money(c, cur) {
    return new Intl.NumberFormat("pt-BR", { style: "currency", currency: cur || state.currency,
      minimumFractionDigits: 2, maximumFractionDigits: 2 }).format((Number(c) || 0) / 100);
  }
  function moneyK(c) {
    var v = (Number(c) || 0) / 100, a = Math.abs(v);
    if (a >= 1000) return "R$ " + new Intl.NumberFormat("pt-BR", { maximumFractionDigits: a >= 10000 ? 0 : 1 }).format(v / 1000) + "k";
    return "R$ " + new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 0 }).format(v);
  }
  function signed(c, cur) { var v = Number(c) || 0; return (v > 0 ? "+" : "") + money(v, cur); }
  function pct(x, d) {
    if (x === null || x === undefined || !isFinite(x)) return "—";
    d = d === undefined ? 1 : d;
    return new Intl.NumberFormat("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }).format(x * 100) + "%";
  }
  function xnum(x) {
    if (x === null || !isFinite(x)) return "—";
    return new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(x) + "x";
  }
  function intf(n) { return new Intl.NumberFormat("pt-BR").format(Number(n) || 0); }
  function pad(n) { return String(n).padStart(2, "0"); }

  /* ---------------- datas ---------------- */
  function offsetStr(tz) { var s = tz < 0 ? "-" : "+", a = Math.abs(tz); return s + pad(Math.floor(a)) + ":" + pad(Math.round((a % 1) * 60)); }
  function partsInTz(ms, tz) { var d = new Date(ms + tz * 3600000); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate() }; }
  function stampIso(p, end, tz) { return p.y + "-" + pad(p.m + 1) + "-" + pad(p.d) + (end ? "T23:59:59" : "T00:00:00") + offsetStr(tz); }
  function shiftDays(p, n) { var d = new Date(Date.UTC(p.y, p.m, p.d)); d.setUTCDate(d.getUTCDate() + n); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate() }; }
  function daysBetween(a, b) { return Math.round((Date.UTC(b.y, b.m, b.d) - Date.UTC(a.y, a.m, a.d)) / 86400000); }
  function rangeFor(period, tz) {
    var today = partsInTz(Date.now(), tz), from = today, to = today;
    if (period === "yesterday") from = to = shiftDays(today, -1);
    else if (period === "7d") from = shiftDays(today, -6);
    else if (period === "30d") from = shiftDays(today, -29);
    else if (period === "month") from = { y: today.y, m: today.m, d: 1 };
    else if (period === "lastmonth") { var f = { y: today.y, m: today.m, d: 1 }; to = shiftDays(f, -1); from = { y: to.y, m: to.m, d: 1 }; }
    return { from: stampIso(from, false, tz), to: stampIso(to, true, tz), fromP: from, toP: to, days: daysBetween(from, to) + 1 };
  }
  function isSingleDay() { return state.period === "today" || state.period === "yesterday"; }
  function periodLabel() {
    return { today: "hoje", yesterday: "ontem", "7d": "nos últimos 7 dias", "30d": "nos últimos 30 dias",
      month: "neste mês", lastmonth: "no mês passado" }[state.period];
  }

  /* ---------------- erros ---------------- */
  function errCopy(e) {
    switch ((e && e.code) || "upstream_error") {
      case "needs_reauth": return { t: "Conexão da Utmify expirou.", h: "Reconecte em claude.ai → Configurações → Conectores." };
      case "server_not_connected": return { t: "Utmify não está conectada.", h: "Adicione em claude.ai → Configurações → Conectores." };
      case "selection_required": return { t: "Há mais de uma conexão Utmify.", h: "Escolha uma quando o Claude perguntar e atualize." };
      case "server_not_found": return { t: "A conexão da Utmify não existe mais.", h: "Reconecte em Configurações → Conectores." };
      case "server_unavailable": return { t: "A Utmify não respondeu.", h: "Instabilidade momentânea — clique em Atualizar em alguns segundos." };
      case "rate_limited": return { t: "Muitas consultas seguidas.", h: "Espere alguns segundos antes de atualizar de novo." };
      case "not_in_manifest": return { t: "Consulta fora do que a página pode chamar.", h: "" };
      case "blocked_by_policy": return { t: "A política da organização bloqueia esta consulta.", h: "" };
      case "approval_required": return { t: "Esta consulta exige aprovação manual.", h: "" };
      case "tool_error":
        if (/meta\s*ads/i.test((e && e.message) || "")) {
          return { t: "A Utmify não conseguiu falar com o Meta Ads agora.",
            h: "Costuma ser instabilidade passageira na conexão entre eles. Tentei 3 vezes automaticamente." };
        }
        return { t: "A Utmify recusou a consulta.", h: (e && e.message) || "" };
      case "not_granted": case "capability_disabled": case "capability_removed":
        return { t: "Esta visualização não recebeu acesso à Utmify.", h: (e && e.message) || "Abra pelo card do artifact no claude.ai." };
      case "cancelled": return { t: "Consulta cancelada.", h: "Clique em Atualizar para tentar de novo." };
      default: return { t: "Não foi possível ler estes dados.", h: (e && e.message) || "" };
    }
  }
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  function call(tool, input) { return state.mcp.callTool(SERVER, tool, input, { cache: false }); }

  // Sao todas leituras, entao repetir e seguro. Alem dos erros marcados como
  // "tentaveis", repetimos tambem tool_error: a ponte da Utmify com o Meta Ads
  // estoura por tempo de forma intermitente e a mesma chamada costuma passar em seguida.
  async function callRetry(tool, input, tries) {
    tries = tries || 2;
    var ultimo;
    for (var i = 0; i < tries; i++) {
      try { return await call(tool, input); }
      catch (e) {
        ultimo = e;
        var transitorio = e && (e.retryable === true || e.code === "tool_error" ||
          e.code === "server_unavailable" || e.code === "upstream_error");
        if (!transitorio || i === tries - 1) throw e;
        await sleep(Math.min(e.retryAfterMs || (500 * Math.pow(2, i)), 4000) + Math.random() * 300);
      }
    }
    throw ultimo;
  }

  /* ---------------- extração ---------------- */
  // As séries horárias vêm sempre com 24 posições; horas futuras chegam zeradas.
  // Localizamos a última hora com movimento real e lemos tudo naquele índice.
  function lastActiveIdx(hc) {
    var ss = [hc.revenueByHourNetCumulative, hc.revenueByHourGrossCumulative, hc.investmentByHourCumulative,
      hc.profitByHourNetCumulative, hc.profitByHourGrossCumulative], idx = -1;
    ss.forEach(function (a) {
      if (!Array.isArray(a)) return;
      for (var i = a.length - 1; i >= 0; i--) { var v = num(a[i] && a[i].cents); if (isFinite(v) && v !== 0) { if (i > idx) idx = i; break; } }
    });
    return idx;
  }
  function atIdx(a, i) { if (!Array.isArray(a) || i < 0 || i >= a.length) return NaN; return num(a[i] && a[i].cents); }

  function core(sum, viewType) {
    var st = sum.statistics || {}, com = st.comissions || {}, ads = st.ads || {},
        an = st.analytics || {}, oc = sum.ordersCount || {}, hc = sum.hourlyCumulative || {};
    var products = (oc.byProductName || []).map(function (p) {
      return { name: p.productName, count: num(p.count) || 0, revenue: num(p.revenue) || 0 };
    }).sort(function (a, b) { return b.revenue - a.revenue; });
    var prodSum = products.reduce(function (a, p) { return a + p.revenue; }, 0);
    var sr = viewType === "Total" ? num(com.gross) : num(com.net);
    if (!isFinite(sr)) sr = num(com.gross);
    var ai = lastActiveIdx(hc);
    var revenue = pick(sr, atIdx(hc.revenueByHourNetCumulative, ai), atIdx(hc.revenueByHourGrossCumulative, ai), prodSum);
    var spend = pick(num(ads.spent), atIdx(hc.investmentByHourCumulative, ai), 0);
    var profit = pick(num(an.profit), atIdx(hc.profitByHourNetCumulative, ai), atIdx(hc.profitByHourGrossCumulative, ai), revenue - spend);
    var approved = num(oc.approved) || 0;
    return {
      revenue: revenue, spend: spend, profit: profit, approved: approved, hc: hc, ai: ai, products: products,
      margin: revenue > 0 ? profit / revenue : null, roas: spend > 0 ? revenue / spend : null,
      pendingRevenue: orNull(com.pendingGrossRevenue), refundedRevenue: orNull(com.refundedGrossRevenue),
      refundRate: orNull(st.refundRate),
      ticket: pick(num(an.avgTicket), approved > 0 ? revenue / approved : 0),
      cpa: pick(num(an.cpa), approved > 0 ? spend / approved : 0),
      totalOrders: num(oc.total) || 0,
      pendingOrders: num(oc.pending) || 0, refundedOrders: num(oc.refunded) || 0,
      clicks: orNull(ads.clicks), pageViews: orNull(ads.pageViews), checkouts: orNull(ads.initiateCheckouts),
      hasStats: isFinite(sr) && isFinite(num(ads.spent))
    };
  }
  function statusOf(r) {
    if (r.revenue === 0 && r.spend === 0) return "idle";
    if (r.profit < 0) return "neg";
    if (r.margin !== null && r.margin < 0.15) return "warn";
    return "pos";
  }
  var STATUS_LABEL = { pos: "lucro", neg: "prejuízo", warn: "margem fina", idle: "sem movimento" };

  /* ---------------- carga principal ---------------- */
  async function load(fresh) {
    if (state.loading) return;
    state.loading = true; state.pageError = null; state.diag = [];
    setBusy(true); safeRender();
    try {
      if (!state.dashboards || fresh) {
        var t0 = Date.now();
        var lr = await callRetry(T_LIST, {});
        if (!Array.isArray(lr.payload)) throw { code: "upstream_error", message: "Formato inesperado na lista de dashboards." };
        state.diag.push({ what: "get_dashboards", ok: true, ms: Date.now() - t0, extra: lr.payload.length + " dashboards" });
        state.geralDash = lr.payload.filter(function (d) { return /geral/i.test(d.name || ""); })[0] || null;
        state.dashboards = lr.payload.filter(function (d) { return !/geral/i.test(d.name || ""); });
        if (!state.dashboards.length) state.dashboards = lr.payload;
        if (state.dashboards[0]) state.currency = state.dashboards[0].currency || "BRL";
      }
      var tz0 = typeof (state.dashboards[0] || {}).timeZone === "number" ? state.dashboards[0].timeZone : -3;
      state.range = rangeFor(state.period, tz0);
      state.series = {}; state.campaigns = {}; state.overview = null;

      state.rows = await Promise.all(state.dashboards.map(async function (d) {
        var tz = typeof d.timeZone === "number" ? d.timeZone : -3;
        var r = rangeFor(state.period, tz), t1 = Date.now();
        try {
          var res = await callRetry(T_SUM, { dashboardId: d.id, dateRange: { from: r.from, to: r.to } });
          var c = core(res.payload || {}, d.viewType);
          c.id = d.id; c.name = d.name; c.currency = d.currency || "BRL"; c.tz = tz;
          c.status = statusOf(c); c.error = null; c.ms = Date.now() - t1;
          state.diag.push({ what: d.name, ok: true, ms: c.ms,
            extra: r.from.slice(0, 10) + "→" + r.to.slice(0, 10) + " · " + (c.hasStats ? "statistics" : "série horária (hora " + c.ai + ")") });
          return c;
        } catch (e) {
          state.diag.push({ what: d.name, ok: false, ms: Date.now() - t1, extra: (e && e.code) || "erro" });
          return { id: d.id, name: d.name, currency: d.currency || "BRL", tz: tz, error: e, status: "idle",
            products: [], revenue: 0, spend: 0, profit: 0, approved: 0, margin: null, roas: null };
        }
      }));
      var failed = state.rows.filter(function (r) { return r.error; });
      if (failed.length && failed.length === state.rows.length) {
        var codes = {}; failed.forEach(function (r) { codes[(r.error && r.error.code) || "x"] = 1; });
        if (Object.keys(codes).length === 1) state.pageError = failed[0].error;
      }
      state.stampedAt = Date.now(); state.pulse = true;
    } catch (e) {
      state.pageError = e && e.code ? e : { code: "upstream_error", message: (e && e.message) || String(e) };
    } finally {
      state.loading = false; setBusy(false); safeRender();
      loadOverview();
      if (state.view === "detail") ensureDetailData();
    }
  }
  function setBusy(on) {
    var b = $("refresh"); b.disabled = on;
    var i = b.querySelector(".ico"); if (i) i.classList.toggle("spinning", on);
    $("stamp").textContent = on ? "consultando…" : stampText();
  }
  function stampText() {
    if (!state.stampedAt) return "—";
    var t = new Date(state.stampedAt);
    return "atualizado " + pad(t.getHours()) + ":" + pad(t.getMinutes()) + ":" + pad(t.getSeconds());
  }
  function rowById(id) { for (var i = 0; i < state.rows.length; i++) if (state.rows[i].id === id) return state.rows[i]; return null; }

  /* ---------------- série consolidada (todas as ofertas) ---------------- */
  async function loadOverview() {
    if (state.overview) return;
    var rows = state.rows.filter(function (r) { return !r.error; });
    if (!rows.length) return;

    // Um dia: as séries horárias já vieram com o resumo de cada oferta.
    // Somar hora a hora é exato e não custa nenhuma consulta extra.
    if (isSingleDay()) {
      var maxAi = -1;
      rows.forEach(function (r) { if (r.ai > maxAi) maxAi = r.ai; });
      var pts = [];
      for (var h = 0; h <= maxAi; h++) {
        var rv = 0, sp = 0, pf = 0;
        rows.forEach(function (r) {
          var hc = r.hc || {};
          rv += pick(atIdx(hc.revenueByHourNetCumulative, h), atIdx(hc.revenueByHourGrossCumulative, h), 0);
          sp += pick(atIdx(hc.investmentByHourCumulative, h), 0);
          pf += pick(atIdx(hc.profitByHourNetCumulative, h), atIdx(hc.profitByHourGrossCumulative, h), 0);
        });
        pts.push({ t: pad(h) + "h", rev: rv, spend: sp, profit: pf, roas: sp > 0 ? rv / sp : 0 });
      }
      state.overview = { done: true, gran: "hora", pts: pts, source: "soma das " + rows.length + " ofertas, hora a hora" };
      safeRender(); return;
    }

    // Vários dias: uma consulta por dia. O Dashboard Geral entrega o consolidado
    // numa única chamada por dia; sem ele, somamos as ofertas (bem mais caro).
    var days = Math.min(state.range.days, 31), list = [];
    for (var i = 0; i < days; i++) list.push(shiftDays(state.range.fromP, i));
    var geral = state.geralDash;
    var srcTxt = geral ? "Dashboard Geral, dia a dia" : "soma das " + rows.length + " ofertas, dia a dia";
    state.overview = { done: false, gran: "dia", pts: [], total: days, got: 0, source: srcTxt };
    safeRender();

    var tz = rows[0].tz;
    async function dayPoint(dp) {
      var range = { from: stampIso(dp, false, tz), to: stampIso(dp, true, tz) };
      var label = pad(dp.d) + "/" + pad(dp.m + 1);
      try {
        if (geral) {
          var r = await callRetry(T_SUM, { dashboardId: geral.id, dateRange: range });
          var c = core(r.payload || {}, geral.viewType);
          return { t: label, rev: c.revenue, spend: c.spend, profit: c.profit, roas: c.spend > 0 ? c.revenue / c.spend : 0 };
        }
        var parts = await Promise.all(rows.map(async function (row) {
          try {
            var rr = await callRetry(T_SUM, { dashboardId: row.id, dateRange: range });
            return core(rr.payload || {}, null);
          } catch (e) { return null; }
        }));
        var rv = 0, sp = 0, pf = 0;
        parts.forEach(function (c) { if (c) { rv += c.revenue; sp += c.spend; pf += c.profit; } });
        return { t: label, rev: rv, spend: sp, profit: pf, roas: sp > 0 ? rv / sp : 0 };
      } catch (e) { return null; }
    }

    var out = [], size = geral ? 6 : 2;
    for (var b = 0; b < list.length; b += size) {
      var res = await Promise.all(list.slice(b, b + size).map(dayPoint));
      out = out.concat(res.filter(Boolean));
      if (!state.overview) return;
      state.overview.pts = out.slice(); state.overview.got = out.length;
      safeRender();
    }
    if (state.overview) { state.overview.done = true; safeRender(); }
  }

  /* ---------------- série temporal do detalhe ---------------- */
  function seriesKey(id) { return id + "|" + state.period; }

  async function ensureDetailData() {
    var row = rowById(state.detailId);
    if (!row || row.error) return;
    loadSeries(row);
    loadCampaigns(row);
  }

  async function loadSeries(row) {
    var k = seriesKey(row.id);
    if (state.series[k]) return;

    // Um dia: a série horária já veio junto do resumo — nenhuma consulta extra.
    if (isSingleDay()) {
      var hc = row.hc || {}, n = row.ai >= 0 ? row.ai + 1 : 0, pts = [];
      for (var h = 0; h < n; h++) {
        var rv = pick(atIdx(hc.revenueByHourNetCumulative, h), atIdx(hc.revenueByHourGrossCumulative, h), 0);
        var sp = pick(atIdx(hc.investmentByHourCumulative, h), 0);
        var pf = pick(atIdx(hc.profitByHourNetCumulative, h), atIdx(hc.profitByHourGrossCumulative, h), rv - sp);
        pts.push({ t: pad(h) + "h", rev: rv, spend: sp, profit: pf, roas: sp > 0 ? rv / sp : 0 });
      }
      state.series[k] = { done: true, gran: "hora", cumulative: true, pts: pts, error: null };
      safeRender(); return;
    }

    // Vários dias: uma consulta por dia, em lotes, com progresso na tela.
    var days = Math.min(state.range.days, 31), list = [];
    for (var i = 0; i < days; i++) list.push(shiftDays(state.range.fromP, i));
    state.series[k] = { done: false, gran: "dia", cumulative: false, pts: [], error: null, total: days, got: 0 };
    safeRender();

    try {
      var out = [];
      for (var b = 0; b < list.length; b += 5) {
        var batch = list.slice(b, b + 5);
        var res = await Promise.all(batch.map(async function (p) {
          try {
            var r = await callRetry(T_SUM, { dashboardId: row.id,
              dateRange: { from: stampIso(p, false, row.tz), to: stampIso(p, true, row.tz) } });
            var c = core(r.payload || {}, null);
            return { t: pad(p.d) + "/" + pad(p.m + 1), rev: c.revenue, spend: c.spend, profit: c.profit,
              roas: c.spend > 0 ? c.revenue / c.spend : 0 };
          } catch (e) { return null; }
        }));
        out = out.concat(res.filter(Boolean));
        var s = state.series[k];
        if (!s) return;
        s.pts = out.slice(); s.got = out.length;
        safeRender();
      }
      state.series[k].done = true;
    } catch (e) {
      if (state.series[k]) { state.series[k].done = true; state.series[k].error = e; }
    }
    safeRender();
  }

  async function loadCampaigns(row) {
    var k = seriesKey(row.id);
    if (state.campaigns[k]) return;
    state.campaigns[k] = { loading: true, items: [], error: null, untracked: 0 };
    safeRender();
    try {
      var r = await callRetry(T_ADS, { dashboardId: row.id, level: "campaign",
        dateRange: { from: state.range.from, to: state.range.to }, orderBy: "greater_profit" }, 3);
      var p = r.payload || {};
      var items = (p.results || []).map(function (c) {
        return {
          id: c.id, name: c.name, status: c.effectiveStatus || c.status,
          spend: num(c.spend) || 0, revenue: num(c.revenue) || 0,
          profit: isFinite(num(c.profit)) ? num(c.profit) : (num(c.revenue) || 0) - (num(c.spend) || 0),
          roas: orNull(c.roas), margin: orNull(c.profitMargin),
          approved: num(c.approvedOrdersCount) || 0, pending: num(c.pendingOrdersCount) || 0,
          total: num(c.totalOrdersCount) || 0,
          cpa: orNull(c.cpa), impressions: num(c.impressions) || 0, clicks: num(c.inlineLinkClicks) || 0,
          ctr: orNull(c.inlineLinkClickCtr), cpm: orNull(c.cpm), checkouts: num(c.initiateCheckout) || 0,
          lpv: num(c.landingPageViews) || 0, budget: orNull(c.dailyBudget), hook: orNull(c.hook), cta: orNull(c.cta)
        };
      }).sort(function (a, b) { return b.profit - a.profit; });
      state.campaigns[k] = { loading: false, items: items, error: null, untracked: num(p.untrackedCount) || 0 };
    } catch (e) {
      state.campaigns[k] = { loading: false, items: [], error: e, untracked: 0 };
    }
    safeRender();
  }

  /* ---------------- gráfico de área ---------------- */
  // Uma série por gráfico e uma única escala — nunca dois eixos y no mesmo desenho.
  function axisMoney(c) {
    var v = (Number(c) || 0) / 100, a = Math.abs(v);
    if (a >= 1000) return new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 1 }).format(v / 1000) + "k";
    return new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 0 }).format(v);
  }
  function axisX(v) { return new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 1 }).format(Number(v) || 0); }

  function icon(kind) {
    var d = {
      rev: '<path d="M8 1v14M11 4.5H6.5a2 2 0 0 0 0 4h3a2 2 0 0 1 0 4H4"/>',
      inv: '<circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.2"/>',
      pro: '<path d="M1.5 12 6 7l3 3 5.5-6"/><path d="M11 4h3.5v3.5"/>',
      roas: '<path d="M2.5 13V7M7 13V3M11.5 13V9"/>'
    }[kind];
    return '<span class="mi"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg></span>';
  }

  // Uma serie por grafico e uma unica escala - nunca dois eixos y no mesmo desenho.
  function areaChart(id, pts, field, color, fmt, afmt, opts) {
    opts = opts || {};
    if (!pts || pts.length < 2) {
      return '<div class="chartnote" style="text-align:left;padding:26px 0">sem pontos suficientes para o gráfico</div>';
    }
    var W = 360, H = 150, PL = 42, PR = 10, PT = 12, PB = 24;
    var vals = pts.map(function (p) { return Number(p[field]) || 0; });
    var lo, hi;
    if (opts.zeroBase === false) {
      lo = Math.min.apply(null, vals); hi = Math.max.apply(null, vals);
      if (opts.ref != null) { lo = Math.min(lo, opts.ref); hi = Math.max(hi, opts.ref); }
      var sp = (hi - lo) || Math.abs(hi) * 0.3 || 0.4;
      lo -= sp * 0.18; hi += sp * 0.18;
    } else {
      lo = Math.min.apply(null, vals.concat([0]));
      hi = Math.max.apply(null, vals);
      if (hi <= lo) hi = lo + 1;
      hi = hi + (hi - lo) * 0.10;
    }
    if (hi <= lo) hi = lo + 1;
    var sx = function (i) { return PL + (i / (pts.length - 1)) * (W - PL - PR); };
    var sy = function (v) { return PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB); };

    var ticks = [hi, (hi + lo) / 2, lo], grid = "";
    ticks.forEach(function (tv) {
      var y = sy(tv);
      grid += '<line class="gl" x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + y.toFixed(1) + '"/>' +
        '<text class="ax" x="' + (PL - 7) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end">' + esc(afmt(tv)) + '</text>';
    });
    if (lo < 0 && hi > 0) {
      grid += '<line class="zl" x1="' + PL + '" y1="' + sy(0).toFixed(1) + '" x2="' + (W - PR) + '" y2="' + sy(0).toFixed(1) + '"/>';
    }
    if (opts.ref != null && opts.ref > lo && opts.ref < hi) {
      var ry = sy(opts.ref);
      grid += '<line class="zl" x1="' + PL + '" y1="' + ry.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + ry.toFixed(1) + '"/>' +
        '<text class="ax" x="' + (W - PR) + '" y="' + (ry - 4).toFixed(1) + '" text-anchor="end">' + esc(opts.refLabel || "") + '</text>';
    }

    var last = pts.length - 1;
    var step = Math.max(1, Math.ceil((pts.length - 1) / 4)), xl = "";
    var limite = W - PR - 30;   // espaco reservado ao rotulo final, para nao colidir
    for (var i = 0; i < pts.length; i += step) {
      if (i === last || sx(i) > limite) break;
      xl += '<text class="ax" x="' + sx(i).toFixed(1) + '" y="' + (H - 7) + '" text-anchor="' +
        (i === 0 ? "start" : "middle") + '">' + esc(pts[i].t) + '</text>';
    }
    xl += '<text class="ax" x="' + (W - PR) + '" y="' + (H - 7) + '" text-anchor="end">' + esc(pts[last].t) + '</text>';

    var d = vals.map(function (v, i) { return (i ? "L" : "M") + sx(i).toFixed(1) + " " + sy(v).toFixed(1); }).join(" ");
    var baseY = sy(opts.zeroBase === false ? lo : Math.max(lo, Math.min(0, hi)));
    var area = d + " L" + sx(last).toFixed(1) + " " + baseY.toFixed(1) + " L" + sx(0).toFixed(1) + " " + baseY.toFixed(1) + " Z";

    CHARTS[id] = { pts: pts, field: field, fmt: fmt, W: W, H: H, PL: PL, PR: PR, sx: sx, sy: sy };

    return '<div class="chartbox" id="cb_' + id + '">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="evolução no período">' +
      grid + xl +
      '<path d="' + area + '" fill="' + color + '" fill-opacity="0.15"/>' +
      '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + sx(last).toFixed(1) + '" cy="' + sy(vals[last]).toFixed(1) + '" r="3.2" fill="' + color + '" stroke="var(--surface)" stroke-width="2"/>' +
      '<line class="ch-cross" x1="0" y1="' + PT + '" x2="0" y2="' + (H - PB) + '" stroke="' + color + '" stroke-width="1" opacity="0"/>' +
      '<circle class="ch-dot" r="4" fill="' + color + '" stroke="var(--surface)" stroke-width="2" opacity="0"/>' +
      '</svg><div class="tip" id="tip_' + id + '"></div></div>';
  }

  function wireCharts() {
    Object.keys(CHARTS).forEach(function (id) {
      var box = $("cb_" + id); if (!box) return;
      var c = CHARTS[id], svg = box.querySelector("svg"), tip = $("tip_" + id);
      var cross = box.querySelector(".ch-cross"), dot = box.querySelector(".ch-dot");
      function move(ev) {
        var r = box.getBoundingClientRect();
        var cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
        var scale = r.width / c.W;                       // viewBox -> pixels
        var plotL = c.PL * scale, plotW = (c.W - c.PL - c.PR) * scale;
        var frac = Math.max(0, Math.min(1, (cx - plotL) / plotW));
        var i = Math.round(frac * (c.pts.length - 1));
        var p = c.pts[i]; if (!p) return;
        var xv = c.sx(i), yv = c.sy(Number(p[c.field]) || 0);
        cross.setAttribute("x1", xv); cross.setAttribute("x2", xv); cross.setAttribute("opacity", "0.5");
        dot.setAttribute("cx", xv); dot.setAttribute("cy", yv); dot.setAttribute("opacity", "1");
        tip.textContent = p.t + " · " + c.fmt(p[c.field]);
        tip.style.left = (xv * scale) + "px";
        tip.style.top = (yv * scale) + "px";
        tip.classList.add("on");
      }
      function out() { cross.setAttribute("opacity", "0"); dot.setAttribute("opacity", "0"); tip.classList.remove("on"); }
      box.addEventListener("mousemove", move);
      box.addEventListener("mouseleave", out);
      box.addEventListener("touchmove", function (e) { move(e); }, { passive: true });
      box.addEventListener("touchend", out);
    });
  }

  function serieNote(ser) {
    if (!ser) return "carregando série…";
    if (ser.gran === "hora") return "acumulado hora a hora no dia";
    return ser.done ? "dia a dia no período" : "montando… " + ser.got + "/" + ser.total + " dias";
  }

  function metricsBlock(pfx, k, ser, cur) {
    var pts = ser && ser.pts && ser.pts.length > 1 ? ser.pts : null;
    var note = serieNote(ser);
    var fm = function (v) { return money(v, cur); };
    var fr = function (v) { return xnum(Number(v) || 0); };
    function card(kind, label, value, valCls, field, color, fmt, afmt, opts) {
      return '<div class="mcard ' + kind + '">' +
        '<div class="mk">' + icon(kind) + label + '</div>' +
        '<div class="mv ' + (valCls || "") + '">' + esc(value) + '</div>' +
        (pts ? areaChart(pfx + "_" + field, pts, field, color, fmt, afmt, opts)
             : '<div class="chartnote" style="text-align:left;padding:26px 0">' + esc(note) + '</div>') +
        '</div>';
    }
    return '<div class="metrics">' +
      card("rev", "Receita", money(k.revenue, cur), "", "rev", "var(--rev)", fm, axisMoney) +
      card("inv", "Investimento", money(k.spend, cur), "", "spend", "var(--inv)", fm, axisMoney) +
      card("pro", "Lucro operacional", signed(k.profit, cur), k.profit < 0 ? "bad" : "", "profit", "var(--pro)", fm, axisMoney) +
      card("roas", "ROAS", xnum(k.roas), "", "roas", "var(--roas)", fr, axisX,
        { zeroBase: false, ref: 1, refLabel: "1,00x equilíbrio" }) +
      '</div>';
  }

  /* ---------------- totais ---------------- */
  function totals() {
    var ok = state.rows.filter(function (r) { return !r.error; });
    var t = { revenue: 0, spend: 0, profit: 0, approved: 0, pendingRevenue: null, refundedRevenue: null,
      checkouts: null, n: ok.length, failed: state.rows.length - ok.length, partial: false };
    ok.forEach(function (r) {
      t.revenue += r.revenue; t.spend += r.spend; t.profit += r.profit; t.approved += r.approved;
      if (r.pendingRevenue !== null) t.pendingRevenue = (t.pendingRevenue || 0) + r.pendingRevenue;
      if (r.refundedRevenue !== null) t.refundedRevenue = (t.refundedRevenue || 0) + r.refundedRevenue;
      if (r.checkouts !== null) t.checkouts = (t.checkouts || 0) + r.checkouts;
      if (!r.hasStats) t.partial = true;
    });
    t.margin = t.revenue > 0 ? t.profit / t.revenue : null;
    t.roas = t.spend > 0 ? t.revenue / t.spend : null;
    t.ticket = t.approved > 0 ? t.revenue / t.approved : 0;
    t.cpa = t.approved > 0 ? t.spend / t.approved : 0;
    return t;
  }

  /* ---------------- render ---------------- */
  function safeRender() {
    try { render(); }
    catch (e) {
      $("app").innerHTML = '<div class="panel"><h2>Erro ao desenhar a página</h2><p>' + esc(e && e.message ? e.message : String(e)) + '</p></div>';
      state.loading = false;
      var b = $("refresh"); if (b) { b.disabled = false; var i = b.querySelector(".ico"); if (i) i.classList.remove("spinning"); }
    }
  }

  function render() {
    CHARTS = {};
    var app = $("app");
    if (state.pageError) {
      var c = errCopy(state.pageError);
      app.innerHTML = '<div class="panel"><h2>' + esc(c.t) + '</h2><p>' + esc(c.h) + '</p>' +
        '<p style="margin-top:10px">Depois de resolver, clique em <b>Atualizar</b>.</p></div>' + footHtml();
      stampUi(); return;
    }
    if (state.loading && !state.rows.length) {
      app.innerHTML = '<div class="rangeline">consultando a Utmify…</div><div class="grid" style="margin-top:22px">' +
        new Array(6).fill('<div class="skel"></div>').join("") + '</div>';
      stampUi(); return;
    }
    if (!state.rows.length) { app.innerHTML = ""; stampUi(); return; }

    app.innerHTML = state.view === "detail" ? detailHtml() : listHtml();
    wireList(); wireCharts(); stampUi();
  }
  function stampUi() {
    var st = $("stamp");
    st.textContent = state.loading ? "consultando…" : stampText();
    st.classList.toggle("fresh", !state.loading && state.pulse);
    if (state.pulse) { state.pulse = false; setTimeout(function () { st.classList.remove("fresh"); }, 2500); }
  }

  function prettyRange() {
    var r = state.range; if (!r) return "";
    var a = r.from.slice(0, 10).split("-"), b = r.to.slice(0, 10).split("-");
    var f = a[2] + "/" + a[1], t = b[2] + "/" + b[1];
    return f === t ? f + "/" + a[0] : f + " → " + t + "/" + b[0];
  }

  /* ---- lista ---- */
  function listHtml() {
    var rs = state.rows, t = totals();
    var ok = rs.filter(function (r) { return !r.error; });
    var pos = ok.filter(function (r) { return r.status === "pos" || r.status === "warn"; });
    var neg = ok.filter(function (r) { return r.status === "neg"; });
    var tot = ok.length || 1;

    var cls = t.profit < 0 ? "is-neg" : t.profit > 0 ? "is-pos" : "is-idle";

    var list = state.onlyLoss ? rs.filter(function (r) { return r.error || r.status === "neg"; }) : rs.slice();
    var s = state.sort;
    list.sort(function (a, b) {
      if (a.error && !b.error) return 1;
      if (b.error && !a.error) return -1;
      if (s === "profit") return b.profit - a.profit;
      if (s === "loss") return a.profit - b.profit;
      if (s === "revenue") return b.revenue - a.revenue;
      if (s === "spend") return b.spend - a.spend;
      if (s === "roas") return (b.roas === null ? -1 : b.roas) - (a.roas === null ? -1 : a.roas);
      return 0;
    });

    var mv = function (v) { return v === null ? "—" : money(v); };

    return '<div class="health">' +
        '<div class="hcard g"><div class="top"><span class="dot g"></span>Ofertas no positivo</div>' +
        '<div class="row"><span class="n">' + pos.length + '</span><span class="of">de ' + ok.length + '</span>' +
        '<span class="pc">' + pct(pos.length / tot, 0) + '</span></div>' +
        '<div class="track"><i style="width:' + (pos.length / tot * 100).toFixed(1) + '%"></i></div></div>' +
        '<div class="hcard r"><div class="top"><span class="dot r"></span>Ofertas no negativo</div>' +
        '<div class="row"><span class="n">' + neg.length + '</span><span class="of">de ' + ok.length + '</span>' +
        '<span class="pc">' + pct(neg.length / tot, 0) + '</span></div>' +
        '<div class="track"><i style="width:' + (neg.length / tot * 100).toFixed(1) + '%"></i></div></div>' +
      '</div>' +

      '<div class="verdict ' + cls + '">' +
        '<span class="lead">' + (t.profit < 0 ? "Prejuízo " : "Lucro ") + esc(periodLabel()) + '</span>' +
        '<span class="big">' + esc(signed(t.profit)) + '</span></div>' +

      '<div class="zone"><h2>Dashboard geral</h2>' +
        (state.overview && !state.overview.done
          ? '<span class="src">' + esc(serieNote(state.overview)) + '</span>' : '') +
        '<span class="ln"></span></div>' +
      metricsBlock("ov", t, state.overview, state.currency) +

      '<div class="subgrid">' +
        sub("Margem", pct(t.margin)) +
        sub("Ticket médio", money(t.ticket)) +
        sub("Custo por venda", money(t.cpa)) +
        sub("Vendas aprovadas", intf(t.approved)) +
        sub("A receber", mv(t.pendingRevenue)) +
        sub("Reembolsado", mv(t.refundedRevenue)) +
      '</div>' +

      '<div class="split"></div>' +
      '<div class="zone"><h2>Ofertas individuais</h2>' +
        '<span class="ln"></span>' +
        '<label class="filter"><input type="checkbox" id="onlyloss"' + (state.onlyLoss ? " checked" : "") + '> só quem está no vermelho</label></div>' +

      (list.length ? '<div class="grid">' + list.map(cardHtml).join("") + '</div>'
        : '<div class="panel"><h2>Nenhuma oferta no vermelho</h2><p>Todas fecharam ' + esc(periodLabel()) + ' com lucro. Desmarque o filtro para ver todas.</p></div>') +
      footHtml();
  }

  function cardHtml(r) {
    if (r.error) {
      var c = errCopy(r.error);
      return '<div class="ocard" style="cursor:default"><div class="bar"></div><div class="pad">' +
        '<div class="oc-head"><div class="oc-name">' + esc(r.name) + '</div><span class="badge">sem dados</span></div>' +
        '<div class="err" style="border:0;border-radius:8px"><b>' + esc(c.t) + '</b> ' + esc(c.h) + '</div></div></div>';
    }
    return '<button class="ocard is-' + r.status + '" data-id="' + esc(r.id) + '">' +
      '<span class="bar"></span>' +
      '<span class="pad">' +
        '<span class="oc-head"><span class="badge">' + STATUS_LABEL[r.status] + '</span></span>' +
        '<span class="oc-name">' + esc(r.name) + '</span>' +
        '<span class="oc-profit"><span class="k">Lucro</span><span class="v">' + esc(signed(r.profit, r.currency)) + '</span></span>' +
        '<span class="oc-grid">' +
          kv("Faturamento", money(r.revenue, r.currency), "rev") +
          kv("Gasto c/ anúncio", money(r.spend, r.currency), "inv") +
          kv("ROAS", xnum(r.roas), "") +
          kv("Margem", pct(r.margin), "") +
        '</span>' +
        '<span class="oc-go"><span>' + intf(r.approved) + ' vendas</span>' +
        '<span>ver análise ›</span></span>' +
      '</span></button>';
  }
  function kv(k, v, cls) {
    return '<span class="kv"><span class="k">' + k + '</span><span class="v ' + cls + '">' + esc(v) + '</span></span>';
  }

  /* ---- detalhe ---- */
  function detailHtml() {
    var r = rowById(state.detailId);
    if (!r) { state.view = "list"; return listHtml(); }
    var k = seriesKey(r.id), ser = state.series[k], camp = state.campaigns[k];
    var cur = r.currency;

    var chartsNote = serieNote(ser);

    var prodBody = productsHtml(r);
    var campBody = campaignsHtml(camp, r);

    return '<button class="back" id="back">‹ Todas as ofertas</button>' +
      '<div class="dhead"><h2>' + esc(r.name) + '</h2>' +
      '<span class="badge ' + "" + '" style="background:var(--' + (r.status === "neg" ? "neg" : r.status === "warn" ? "warn" : r.status === "pos" ? "pro" : "idle") + '-soft);color:var(--' +
        (r.status === "neg" ? "neg" : r.status === "warn" ? "warn" : r.status === "pos" ? "pro" : "idle") + ')">' + STATUS_LABEL[r.status] + '</span></div>' +
      '<div class="rangeline">' + esc(prettyRange()) + ' · ' + esc(chartsNote) + '</div>' +

      metricsBlock("d", r, ser, cur) +

      '<div class="subgrid">' +
        sub("Margem", pct(r.margin)) +
        sub("Ticket médio", money(r.ticket, cur)) +
        sub("Custo por venda", money(r.cpa, cur)) +
        sub("Vendas aprovadas", intf(r.approved)) +
        sub("A receber", r.pendingRevenue === null ? "—" : money(r.pendingRevenue, cur)) +
        sub("Reembolsado", r.refundedRevenue === null ? "—" : money(r.refundedRevenue, cur)) +
      '</div>' +

      '<div class="block"><h3>Funil de conversão <span class="cnt">' +
        esc(funnelSource(r, camp).src || "Meta Ads") + '</span></h3>' +
      funnelHtml(r, camp) + '</div>' +

      '<div class="block"><h3>Produtos dentro da oferta <span class="cnt">' + r.products.length + '</span></h3>' +
      '<div class="body">' + prodBody + '</div></div>' +

      '<div class="block"><h3>Campanhas do Meta Ads' +
        (camp && !camp.loading && !camp.error ? ' <span class="cnt">' + camp.items.length +
          (camp.untracked ? ' · ' + camp.untracked + ' vendas sem rastreio' : '') + '</span>' : '') +
      '</h3>' + campBody + '</div>' + footHtml();
  }
  function sub(k, v) { return '<div class="sub"><div class="k">' + k + '</div><div class="v">' + esc(v) + '</div></div>'; }

  function productsHtml(r) {
    if (!r.products.length) return '<p style="margin:0;font-size:13px;color:var(--ink-3)">Nenhuma venda registrada neste período.</p>';
    var max = r.products[0].revenue || 1;
    var body = r.products.map(function (p) {
      var w = Math.max(3, Math.round((p.revenue / max) * 60));
      return '<tr><td><div class="pname"><span class="pb" style="width:' + w + 'px"></span>' +
        '<span title="' + esc(p.name) + '">' + esc(p.name) + '</span></div></td>' +
        '<td class="num">' + intf(p.count) + '</td>' +
        '<td class="num">' + esc(money(p.revenue, r.currency)) + '</td>' +
        '<td class="num" style="color:var(--ink-3)">' + esc(pct(r.revenue > 0 ? p.revenue / r.revenue : 0, 0)) + '</td></tr>';
    }).join("");
    return '<div class="scroll"><table class="t"><thead><tr><th>Produto</th><th>Vendas</th><th>Faturamento</th><th>Peso</th></tr></thead><tbody>' +
      body + '</tbody></table></div>';
  }

  // O funil tem duas fontes possiveis. A preferida e o resumo da oferta; quando a
  // Utmify nao devolve o bloco de trafego, as mesmas metricas existem campanha a
  // campanha em get_meta_ad_objects — somando as campanhas o funil se monta igual.
  function funnelSource(r, camp) {
    var doResumo = {
      clicks: r.clicks, pageViews: r.pageViews, checkouts: r.checkouts,
      totalOrders: r.totalOrders, approved: r.approved
    };
    var somaResumo = (r.clicks || 0) + (r.pageViews || 0) + (r.checkouts || 0);
    if (somaResumo > 0) return { d: doResumo, src: "resumo da oferta", pronto: true };

    if (camp && camp.loading) return { d: null, src: null, pronto: false };
    if (camp && !camp.error && camp.items.length) {
      var a = { clicks: 0, pageViews: 0, checkouts: 0, totalOrders: 0, approved: 0 };
      camp.items.forEach(function (c) {
        a.clicks += c.clicks || 0; a.pageViews += c.lpv || 0; a.checkouts += c.checkouts || 0;
        a.totalOrders += c.total || 0; a.approved += c.approved || 0;
      });
      if (a.clicks + a.pageViews + a.checkouts > 0) {
        // as vendas da oferta sao mais completas que a soma atribuida as campanhas
        a.totalOrders = Math.max(a.totalOrders, r.totalOrders || 0);
        a.approved = Math.max(a.approved, r.approved || 0);
        return { d: a, src: "somado das " + camp.items.length + " campanhas", pronto: true };
      }
    }
    return { d: doResumo, src: "resumo da oferta", pronto: true };
  }

  function funnelHtml(r, camp) {
    var f = funnelSource(r, camp);
    if (!f.pronto) return '<div class="loading">montando o funil a partir das campanhas…</div>';
    var d = f.d;
    var steps = [
      { k: "Cliques", v: d.clicks },
      { k: "Vis. Página", v: d.pageViews },
      { k: "ICs", v: d.checkouts },
      { k: "Vendas Inic.", v: d.totalOrders },
      { k: "Vendas Apr.", v: d.approved }
    ];
    var vals = steps.map(function (st) { return Math.max(0, Number(st.v) || 0); });
    if (!vals.some(function (v) { return v > 0; })) {
      return '<div class="body"><p style="margin:0;font-size:13px;color:var(--ink-3)">' +
        'Nenhum tráfego e nenhuma venda registrados nesta oferta no período selecionado.</p></div>';
    }

    var base = vals[0] || vals.filter(function (v) { return v > 0; })[0] || 0;
    var max = Math.max.apply(null, vals) || 1;

    // A forma vive num viewBox esticado (preserveAspectRatio="none"); os textos
    // ficam em HTML por cima, para nao crescerem junto com a largura da tela.
    var W = 600, H = 120, MID = H / 2, BAND = H - 12;
    var n = steps.length, colW = W / n;
    var cx = function (i) { return (i + 0.5) * colW; };
    var hh = function (i) { return Math.max(3, (vals[i] / max) * BAND); };

    var pts = [{ x: 0, h: hh(0) }];
    for (var i = 0; i < n; i++) pts.push({ x: cx(i), h: hh(i) });
    pts.push({ x: W, h: hh(n - 1) });

    function edge(list, top, first) {
      var out = "";
      list.forEach(function (pt, i) {
        var y = top ? MID - pt.h / 2 : MID + pt.h / 2;
        if (i === 0) { out += (first ? "M" : "L") + pt.x.toFixed(1) + "," + y.toFixed(1); return; }
        var pv = list[i - 1], py = top ? MID - pv.h / 2 : MID + pv.h / 2;
        var dx = (pt.x - pv.x) * 0.42;
        out += "C" + (pv.x + dx).toFixed(1) + "," + py.toFixed(1) + " " +
               (pt.x - dx).toFixed(1) + "," + y.toFixed(1) + " " +
               pt.x.toFixed(1) + "," + y.toFixed(1);
      });
      return out;
    }
    var shape = edge(pts, true, true) + edge(pts.slice().reverse(), false, false) + "Z";
    var gid = "fg_" + String(r.id).replace(/[^A-Za-z0-9_]/g, "");

    var topo = "", pcs = "", baixo = "", taxas = "", divs = "";
    for (var j = 0; j < n; j++) {
      var perc = base > 0 ? vals[j] / base : 0;
      var passo = j > 0 && vals[j - 1] > 0 ? vals[j] / vals[j - 1] : null;
      topo += "<span>" + esc(steps[j].k) + "</span>";
      pcs += "<span>" + esc(pct(perc, 1)) + "</span>";
      baixo += "<span>" + intf(vals[j]) + "</span>";
      taxas += "<i>" + (passo !== null ? "<span>\u2192 " + esc(pct(passo, 1)) + "</span>" : "") + "</i>";
      divs += "<i></i>";
    }

    return '<div class="body"><div class="funnel">' +
      '<div class="fn-row fn-top">' + topo + '</div>' +
      '<div class="fn-shape">' +
        '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="funil de conversão">' +
        '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="1" y2="0">' +
        '<stop offset="0%" stop-color="var(--fun-a)"/><stop offset="100%" stop-color="var(--fun-b)"/>' +
        '</linearGradient></defs>' +
        '<path d="' + shape + '" fill="url(#' + gid + ')"/></svg>' +
        '<div class="fn-div">' + divs + '</div>' +
        '<div class="fn-pcs">' + pcs + '</div>' +
      '</div>' +
      '<div class="fn-row fn-bot">' + baixo + '</div>' +
      '<div class="fn-row fn-rate">' + taxas + '</div>' +
      '</div></div>';
  }

  function campaignsHtml(camp, r) {
    if (!camp || camp.loading) return '<div class="loading">carregando campanhas do Meta Ads…</div>';
    if (camp.error) {
      var c = errCopy(camp.error);
      return '<div class="err"><b>' + esc(c.t) + '</b> ' + esc(c.h) +
        '<div style="margin-top:10px"><button class="btn ghost" id="retryCamp">Tentar de novo</button></div></div>';
    }
    if (!camp.items.length) return '<div class="body"><p style="margin:0;font-size:13px;color:var(--ink-3)">Nenhuma campanha do Meta Ads com atividade neste período.</p></div>';
    var cur = r.currency;
    var body = camp.items.map(function (c) {
      var rp = c.roas === null ? "—" : xnum(c.roas);
      var rcls = c.roas === null ? "" : c.roas >= 1.5 ? "g" : c.roas >= 1 ? "w" : "r";
      var on = /ACTIVE/i.test(c.status || "");
      return '<tr>' +
        '<td><div class="cname"><span class="cst ' + (on ? "on" : "off") + '"></span><span style="min-width:0">' +
          '<b title="' + esc(c.name) + '">' + esc(c.name) + '</b>' +
          '<small>' + esc(on ? "ativa" : (c.status || "pausada").toLowerCase()) +
          (c.budget ? " · orçamento " + esc(money(c.budget, cur)) + "/dia" : "") + '</small>' +
        '</span></div></td>' +
        '<td class="num ' + (c.profit < 0 ? "negv" : "pos") + '">' + esc(signed(c.profit, cur)) + '</td>' +
        '<td class="num">' + esc(money(c.revenue, cur)) + '</td>' +
        '<td class="num" style="color:var(--inv)">' + esc(money(c.spend, cur)) + '</td>' +
        '<td class="num"><span class="roaspill ' + rcls + '">' + esc(rp) + '</span></td>' +
        '<td class="num">' + intf(c.approved) + '</td>' +
        '<td class="num">' + esc(c.cpa === null ? "—" : money(c.cpa, cur)) + '</td>' +
        '<td class="num" style="color:var(--ink-3)">' + esc(c.ctr === null ? "—" : (c.ctr.toFixed(2) + "%")) + '</td>' +
        '<td class="num" style="color:var(--ink-3)">' + intf(c.impressions) + '</td>' +
        '</tr>';
    }).join("");
    var tS = camp.items.reduce(function (a, c) { return a + c.spend; }, 0);
    var tR = camp.items.reduce(function (a, c) { return a + c.revenue; }, 0);
    var tP = camp.items.reduce(function (a, c) { return a + c.profit; }, 0);
    var tA = camp.items.reduce(function (a, c) { return a + c.approved; }, 0);
    return '<div class="body"><div class="scroll"><table class="t">' +
      '<thead><tr><th>Campanha</th><th>Lucro</th><th>Receita</th><th>Gasto</th><th>ROAS</th><th>Vendas</th><th>CPA</th><th>CTR</th><th>Impressões</th></tr></thead>' +
      '<tbody>' + body + '</tbody>' +
      '<tfoot><tr style="border-top:2px solid var(--line-strong)">' +
        '<td style="padding-top:10px;font-weight:700;font-size:12px">Total das campanhas</td>' +
        '<td class="num ' + (tP < 0 ? "negv" : "pos") + '" style="padding-top:10px;font-weight:700">' + esc(signed(tP, cur)) + '</td>' +
        '<td class="num" style="padding-top:10px;font-weight:700">' + esc(money(tR, cur)) + '</td>' +
        '<td class="num" style="padding-top:10px;font-weight:700;color:var(--inv)">' + esc(money(tS, cur)) + '</td>' +
        '<td class="num" style="padding-top:10px;font-weight:700">' + esc(tS > 0 ? xnum(tR / tS) : "—") + '</td>' +
        '<td class="num" style="padding-top:10px;font-weight:700">' + intf(tA) + '</td>' +
        '<td colspan="3"></td>' +
      '</tr></tfoot></table></div>' +
      (camp.untracked ? '<p style="margin:12px 0 0;font-size:11.5px;color:var(--ink-3)">' +
        camp.untracked + ' venda(s) do período não tinham UTM apontando para nenhuma campanha, então aparecem no total da oferta mas não nesta tabela.</p>' : '') +
      '</div>';
  }

  // Rodape silencioso: so aparece quando alguma consulta falhou, para o
  // diagnostico continuar existindo sem poluir a tela no dia a dia.
  function footHtml() {
    var falhas = (state.diag || []).filter(function (d) { return !d.ok; });
    if (!falhas.length) return "";
    var linhas = state.diag.map(function (d) {
      return "<tr><td class='" + (d.ok ? "good" : "bad") + "'>" + (d.ok ? "ok" : "falhou") + "</td><td>" +
        esc(d.what) + "</td><td>" + d.ms + " ms</td><td>" + esc(d.extra || "") + "</td></tr>";
    }).join("");
    return '<div class="foot"><details class="diag" open><summary>' + falhas.length +
      ' consulta(s) falharam — detalhes</summary><table class="dg"><tbody>' + linhas +
      '</tbody></table></details></div>';
  }

  /* ---------------- eventos ---------------- */
  function wireList() {
    var ol = $("onlyloss");
    if (ol) ol.addEventListener("change", function (e) { state.onlyLoss = e.target.checked; safeRender(); });
    Array.prototype.forEach.call(document.querySelectorAll(".ocard[data-id]"), function (b) {
      b.addEventListener("click", function () {
        state.detailId = b.getAttribute("data-id"); state.view = "detail";
        window.scrollTo({ top: 0, behavior: "auto" });
        safeRender(); ensureDetailData();
      });
    });
    var bk = $("back");
    if (bk) bk.addEventListener("click", function () { state.view = "list"; state.detailId = null; safeRender(); });
    var rc = $("retryCamp");
    if (rc) rc.addEventListener("click", function () {
      var row = rowById(state.detailId); if (!row) return;
      rc.disabled = true; rc.textContent = "consultando…";
      delete state.campaigns[seriesKey(row.id)];
      loadCampaigns(row);
    });
  }

  $("period").addEventListener("change", function (e) { state.period = e.target.value; load(false); });
  $("sort").addEventListener("change", function (e) { state.sort = e.target.value; safeRender(); });
  // Com a ligação direta, atualizar é o que sempre foi: recarregar os dados.
  $("refresh").addEventListener("click", function () { load(true); });

  $("app").innerHTML = '<div class="grid" style="margin-top:24px">' + new Array(6).fill('<div class="skel"></div>').join("") + '</div>';

  // ---- camada de dados local ----------------------------------------
  // Mesma assinatura do MCP do claude.ai: callTool(servidor, ferramenta,
  // entrada) devolvendo { payload }. A diferença é que aqui a resposta vem do
  // cache que o painel guardou no PC, não da Utmify ao vivo.
  var mcpLocal = {
    callTool: async function (servidor, ferramenta, entrada) {
      var r = await fetch("/api/utmify", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ ferramenta: ferramenta, entrada: entrada || {} }),
      });
      var d = await r.json();
      if (!r.ok) {
        throw { code: d.code || "upstream_error", message: d.erro || "não achei esses números no cache", retryable: false };
      }
      return { payload: d.payload };
    },
  };

  (async function () {
    state.mcp = mcpLocal;
    load(false);
  })();
})();
</script>

</body></html>
