<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pão Recheado Lucrativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest: #B06E13;
    --forest-light: #FAC775;
    --forest-deep: #3A2416;
    --cream: #FFF7EC;
    --paper: #FBE8CF;
    --paper-dark:#F0DDB8;
    --terracotta: #D98326;
    --terracotta-light: #FAC775;
    --ink: #3A2416;
    --ink-soft: #7A6754;
    --sage: #9BB98C;
    --line: rgba(43,33,21,0.1);
    --c-massa: #94530F; --c-massa-bg: #FBE8CF;
    --c-salgado: #B15748; --c-salgado-bg: #F5DEDA;
    --c-doce: #7C6BA3; --c-doce-bg: #E9E3F2;
    --b4: #4F7C9C; --b4-bg: #E0EAF1;
    --b5: #5F8C60; --b5-bg: #E2EEE0;
    --b6: #B06E13; --b6-bg: #FBE8CF;
    --c-m8: #C79433;  --c-m8-bg: #F6ECD3;
    --c-m10: #5F8C60; --c-m10-bg: #E2EEE0;
    --c-m12: #4F7C9C; --c-m12-bg: #E0EAF1;
    --c-m18: #B96C80; --c-m18-bg: #F5E1E7;
    --b1: #C97088;    --b1-bg: #F8E4EA;
    --b2: #DB8557;    --b2-bg: #FBEBDF;
    --b3: #BF9330;    --b3-bg: #F6ECD4;
    --b7: #5D7F4C;    --b7-bg: #E3EEDD;
    --bg-guide1: #B15748; --bg-guide1-bg: #F5DEDA;
    --bg-guide2: #47807F; --bg-guide2-bg: #DCEBEB;
    --bg-guide3: #7C6BA3; --bg-guide3-bg: #E9E3F2;
    --radius: 18px;
    --radius-sm: 10px;
    --shadow: 0 10px 30px -12px rgba(140,74,38,0.22);
    --shadow-sm: 0 4px 14px -6px rgba(140,74,38,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--cream);color:var(--ink);font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  h1,h2,h3,.serif{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em;margin:0;}
  .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-soft);}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  ::selection{background:var(--terracotta-light);color:var(--forest-deep);}
  /* ---------- NAV ---------- */
  .nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
    padding:16px 32px;background:rgba(255,248,240,0.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .logo{font-family:'Fraunces',serif;font-weight:700;font-size:19px;color:var(--forest);}
  .logo span{color:var(--terracotta);}
  .nav-links{display:flex;gap:4px;align-items:center;}
  .nav-links button{padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-soft);transition:all .18s ease;}
  .nav-links button:hover{background:var(--paper);color:var(--ink);}
  .nav-links button.active{background:var(--forest);color:#fff;}
  @media(max-width:820px){ .nav{padding:14px 18px;} .nav-links{display:none;} }
  .bottom-nav{display:none;}
  @media(max-width:820px){
    .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:60;
      background:rgba(255,248,240,0.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);
      padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px -10px rgba(0,0,0,0.15);}
    .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
      padding:6px 2px;border-radius:12px;color:var(--ink-soft);transition:color .15s ease, background .15s ease;}
    .bottom-nav .bn-icon{font-size:20px;line-height:1;}
    .bottom-nav .bn-label{font-size:10.5px;font-weight:700;}
    .bottom-nav button.active{color:var(--forest);background:var(--paper);}
  }
  .page{max-width:1180px;margin:0 auto;padding:0 32px 100px;}
  @media(max-width:820px){.page{padding:0 18px 96px;}}
  /* ---------- HERO ---------- */
  .hero{display:grid;grid-template-columns:1fr;gap:24px;align-items:center;padding:64px 0 40px;}
  @media(max-width:900px){.hero{padding:36px 0 20px;gap:20px;}}
  .hero-eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--paper);padding:6px 14px;border-radius:999px;margin-bottom:22px;}
  .hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--terracotta);}
  .hero h1{font-size:clamp(38px,5.2vw,60px);line-height:1.05;color:var(--forest);}
  .hero h1 em{font-style:italic;color:var(--terracotta);font-weight:500;}
  .hero p.lead{font-size:17px;color:var(--ink-soft);max-width:460px;margin-top:18px;line-height:1.6;}
  .stat-row{display:flex;gap:36px;margin-top:34px;flex-wrap:wrap;}
  .stat b{font-family:'Fraunces',serif;font-size:30px;color:var(--forest);display:block;font-weight:600;}
  .stat span{font-size:12.5px;color:var(--ink-soft);font-family:'Space Mono',monospace;letter-spacing:.04em;}
  .section-label{text-align:center;margin:8px 0 26px;}
  .section-label .eyebrow{display:block;}
  .collections{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
  /* Cards de coleção com capa em MOCKUP (arte oficial da oferta, não foto de comida):
     a arte precisa aparecer INTEIRA, por isso object-fit:contain sobre fundo tonalizado,
     com o texto num bloco sólido embaixo — nunca por cima de um gradiente escuro. */
  .coll-card{border-radius:var(--radius);overflow:hidden;background:#fff;border:1px solid var(--line);
    box-shadow:var(--shadow-sm);display:flex;flex-direction:column;cursor:pointer;transition:transform .2s ease, box-shadow .2s ease;}
  .coll-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);}
  .coll-card:hover .coll-photo{transform:scale(1.05);}
  .coll-media{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    padding:16px;background:radial-gradient(circle at 50% 38%, #FFFFFF 0%, var(--paper) 82%);}
  .coll-photo{max-width:100%;max-height:100%;object-fit:contain;display:block;
    filter:drop-shadow(0 12px 20px rgba(140,74,38,0.30));transition:transform .3s ease;}
  .coll-badge{position:absolute;top:10px;left:10px;background:var(--forest);color:#fff;
    font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.06em;padding:5px 10px;
    border-radius:999px;font-weight:700;box-shadow:0 3px 10px -4px rgba(0,0,0,0.35);}
  .coll-body{padding:14px 16px 18px;border-top:1px solid var(--line);flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;}
  .coll-title{font-family:'Fraunces',serif;color:var(--forest-deep);font-size:16.5px;line-height:1.18;font-weight:700;letter-spacing:-0.01em;}
  .coll-sub{color:var(--ink-soft);font-size:11px;font-family:'Space Mono',monospace;letter-spacing:.03em;}
  .recipes-head{padding-top:40px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:13.5px;font-weight:600;margin-bottom:18px;}
  .back-link:hover{color:var(--forest);}
  .search-box{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:13px 20px;margin:22px 0 16px;box-shadow:var(--shadow-sm);}
  .search-box input{border:none;outline:none;font-size:14.5px;width:100%;background:none;font-family:'Manrope';}
  .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:30px;}
  .pill{padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:700;background:#fff;
    border:1px solid var(--line);color:var(--ink-soft);display:flex;align-items:center;gap:6px;transition:all .15s ease;}
  .pill:hover{border-color:var(--forest);}
  .pill.active{background:var(--forest);color:#fff;border-color:var(--forest);}
  .recipe-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
  .r-card{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);
    transition:transform .18s ease, box-shadow .18s ease;cursor:pointer;border:1px solid rgba(43,33,21,0.05);}
  .r-card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -16px rgba(140,74,38,0.32);}
  .r-art{aspect-ratio:4/3;position:relative;display:flex;align-items:center;justify-content:center;font-size:46px;overflow:hidden;}
  .r-art img.r-img{transition:transform .5s cubic-bezier(.2,.8,.2,1);}
  .r-card:hover .r-art img.r-img{transform:scale(1.1);}
  .r-art .r-cat-chip{position:absolute;top:10px;left:10px;z-index:2;background:rgba(255,255,255,0.92);
    backdrop-filter:blur(4px);padding:5px 11px;border-radius:999px;font-family:'Space Mono',monospace;
    font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 3px 10px -4px rgba(0,0,0,0.25);}
  .r-art .r-shade{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(180deg, rgba(0,0,0,0.06) 0%, rgba(0,0,0,0) 32%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.14) 100%);}
  .r-art .fav{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,0.85);display:flex;align-items:center;justify-content:center;
    font-size:15px;transition:transform .15s ease;z-index:2;}
  .r-art .fav:hover{transform:scale(1.1);}
  .r-body{padding:14px 15px 17px;}
  .r-name{font-family:'Fraunces',serif;font-size:16.5px;font-weight:600;margin-top:5px;line-height:1.2;}
  .r-time{font-size:12px;color:var(--ink-soft);margin-top:8px;display:flex;align-items:center;gap:5px;}
  .r-age{display:inline-flex;align-items:center;gap:4px;margin-top:8px;background:var(--paper);
    color:var(--forest-deep);border-radius:999px;padding:4px 9px;font-size:10.5px;font-weight:800;letter-spacing:.02em;}
  .result-count{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;
    color:var(--ink-soft);text-transform:uppercase;margin:-14px 0 18px;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty-state .big{font-size:38px;margin-bottom:10px;}
  /* ---------- LISTA DE COMPRAS ---------- */
  .list-summary{display:flex;flex-direction:column;align-items:center;text-align:center;padding:90px 20px 40px;}
  .list-cart-icon{width:74px;height:74px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:22px;}
  .list-summary h2{font-family:'Fraunces',serif;font-size:24px;color:var(--forest);}
  .list-summary p{color:var(--ink-soft);font-size:14px;margin:8px 0 26px;}
  .list-summary-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);padding:11px 22px;border-radius:999px;
    font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s ease;}
  .btn-outline:hover{border-color:var(--forest);}
  .btn-terracotta{background:var(--terracotta);color:#fff;padding:11px 22px;border-radius:999px;
    font-weight:700;font-size:14px;white-space:nowrap;transition:transform .15s ease, background .15s;}
  .btn-terracotta:hover{background:#B06E13;transform:translateY(-1px);}
  .btn-terracotta[disabled]{background:var(--paper-dark);color:var(--ink-soft);cursor:not-allowed;}
  .btn-terracotta[disabled]:hover{transform:none;background:var(--paper-dark);}
  .list-header{padding-top:36px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;}
  .list-header h1{font-size:30px;color:var(--forest);}
  .list-progress{font-family:'Space Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .list-actions{display:flex;gap:10px;}
  .list-groups{margin-top:26px;display:flex;flex-direction:column;gap:22px;}
  .list-items{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;}
  .list-item{display:flex;align-items:center;gap:13px;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14.5px;cursor:pointer;}
  .list-item:last-child{border-bottom:none;}
  .list-item .box{width:21px;height:21px;border-radius:6px;border:2px solid var(--sage);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:all .15s ease;}
  .list-item.checked .box{background:var(--forest);border-color:var(--forest);}
  .list-item.checked span.txt{text-decoration:line-through;color:var(--ink-soft);}
  .list-item .from{font-size:11px;color:var(--ink-soft);margin-left:auto;font-family:'Space Mono',monospace;flex-shrink:0;padding-left:8px;}
  /* ---------- MODAL ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(30,20,12,0.55);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:var(--cream);border-radius:22px;max-width:760px;width:100%;max-height:88vh;
    display:flex;flex-direction:column;box-shadow:0 30px 60px -20px rgba(0,0,0,0.4);overflow:hidden;}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:24px 26px 0;}
  .modal-close{width:34px;height:34px;border-radius:50%;background:var(--paper);font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .modal-search-wrap{padding:0 26px;}
  .modal-body{overflow-y:auto;padding:4px 26px 20px;flex:1;}
  .modal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media(max-width:600px){.modal-grid{grid-template-columns:repeat(2,1fr);}}
  .modal-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);cursor:pointer;border:2px solid transparent;transition:border-color .15s ease;}
  .modal-card.selected{border-color:var(--forest);}
  .modal-art{aspect-ratio:4/3;position:relative;display:flex;align-items:center;justify-content:center;font-size:34px;}
  .modal-check{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;
    background:rgba(255,255,255,0.9);border:2px solid rgba(0,0,0,0.15);display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;z-index:2;}
  .modal-card.selected .modal-check{background:var(--forest);border-color:var(--forest);color:#fff;}
  .modal-info{padding:9px 11px 12px;}
  .modal-cat{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
  .modal-name{font-size:13px;font-weight:700;margin-top:3px;line-height:1.25;}
  .modal-foot{display:flex;justify-content:space-between;align-items:center;padding:16px 26px;border-top:1px solid var(--line);background:#fff;}
  /* ---------- GUIA (bônus em texto) ---------- */
  .guide-wrap{max-width:640px;margin:0 auto;padding-top:34px;}
  .guide-hero{border-radius:22px;padding:34px 28px;color:#fff;margin-bottom:28px;box-shadow:var(--shadow);}
  .guide-hero .icon{font-size:40px;margin-bottom:12px;}
  .guide-hero h1{font-size:25px;color:#fff;}
  .guide-hero p{margin-top:8px;font-size:14.5px;color:rgba(255,255,255,0.85);line-height:1.6;}
  .guide-tips{display:flex;flex-direction:column;gap:14px;}
  .guide-tip{display:flex;gap:14px;background:#fff;border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);}
  .guide-tip .n{width:30px;height:30px;border-radius:50%;background:var(--paper);color:var(--forest);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;font-family:'Fraunces',serif;}
  .guide-tip h3{font-size:15.5px;color:var(--forest);margin-bottom:4px;}
  .guide-tip p{font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin:0;}
  .guide-note{background:var(--paper);border-radius:14px;padding:16px 18px;font-size:13px;color:var(--ink-soft);line-height:1.6;margin-top:18px;}
  .guide-note b{color:var(--forest-deep);}
  /* ---------- CARDÁPIOS ---------- */
  .cardapio-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
  .cardapio-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;cursor:pointer;transition:transform .18s ease, box-shadow .18s ease;}
  .cardapio-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
  .cardapio-strip{display:grid;grid-template-columns:repeat(5,1fr);height:90px;}
  .cardapio-strip .cs-item{background-size:cover;background-position:center;position:relative;
    display:flex;align-items:center;justify-content:center;font-size:20px;border-right:2px solid var(--cream);}
  .cardapio-strip .cs-item:last-child{border-right:none;}
  .cardapio-body{padding:16px 18px;}
  .cardapio-eyebrow{font-family:'Space Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--terracotta);}
  .cardapio-title{font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:var(--forest);margin-top:4px;}
  .cardapio-sub{font-size:13px;color:var(--ink-soft);margin-top:5px;line-height:1.4;}
  .meal-slot{display:flex;align-items:center;gap:14px;background:#fff;border-radius:var(--radius);
    box-shadow:var(--shadow-sm);padding:14px;margin-bottom:14px;cursor:pointer;transition:transform .15s ease;}
  .meal-slot:hover{transform:translateY(-2px);}
  .meal-slot .ms-art{width:64px;height:64px;border-radius:12px;flex-shrink:0;background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center;font-size:26px;}
  .meal-slot .ms-info{flex:1;min-width:0;}
  .meal-slot .ms-label{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--terracotta);}
  .meal-slot .ms-name{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--forest);margin-top:3px;}
  .meal-slot .ms-time{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  /* ---------- RECEITA ESTILO CARTÃO (layout de assinatura) ---------- */
  .card-recipe{max-width:640px;margin:0 auto;padding-top:22px;}
  .card-banner{position:relative;background:linear-gradient(100deg,#FAC775,#D98326);
    background-image:linear-gradient(100deg,#FAC775,#D98326), radial-gradient(circle at 90% 10%, rgba(255,255,255,0.25), transparent 40%);
    border-radius:26px 8px 26px 8px;padding:26px 34px 30px;margin-bottom:22px;box-shadow:0 12px 28px -14px rgba(140,74,38,0.5);}
  .card-banner-heart{position:absolute;top:14px;right:18px;font-size:19px;opacity:.9;width:34px;height:34px;
    border-radius:50%;background:rgba(255,255,255,0.28);display:flex;align-items:center;justify-content:center;}
  .card-banner h1{font-family:'Caveat',cursive;font-weight:700;color:#2B2115;font-size:clamp(30px,7vw,50px);
    line-height:1.08;margin:0;padding-right:36px;text-shadow:0 1px 0 rgba(255,255,255,0.25);}
  .card-banner .cb-rule{width:100px;height:3px;background:#2B2115;opacity:.5;border-radius:3px;margin-top:10px;}
  .card-meta-photo{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;margin-bottom:22px;}
  .card-meta-list{display:flex;flex-direction:column;gap:20px;}
  .card-meta-row{display:flex;align-items:center;gap:14px;}
  .card-meta-badge{width:52px;height:52px;border-radius:50%;border:2.5px solid #E8946A;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:22px;color:#C9703F;background:#fff;}
  .card-meta-text .cm-label{font-size:14.5px;color:var(--ink);font-weight:500;}
  .card-meta-text .cm-value{font-size:15px;color:var(--ink);font-weight:700;margin-top:1px;}
  .card-photo-wrap{position:relative;aspect-ratio:1/1;border-radius:50%;overflow:hidden;border:6px solid #fff;
    justify-self:center;width:100%;max-width:280px;
    box-shadow:0 16px 34px -12px rgba(140,74,38,0.4), 0 0 0 1px rgba(255,255,255,0.6) inset;}
  .card-photo-wrap::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:1.5px dashed rgba(216,123,74,0.35);pointer-events:none;}
  .card-photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-photo-wrap .cp-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:64px;background:var(--paper);}
  @media(max-width:560px){

let state = {
  route:'home', search:'', filter:'todas',
  /* As favoritas ficam salvas no aparelho: a pessoa marca hoje e encontra amanhã. */
  favorites:new Set((function(){ try{ return JSON.parse(localStorage.getItem('app_favs')) || []; }catch(e){ return []; } })()),
  detailId:null,
  listSelected:new Set(), listModalSearch:'', listModalFilter:'todas', generatedList:null, checkedItems:new Set(),
  bonusN:null, bonusSearch:'', bonusDetailId:null, cardapioId:null, certNome:'',
  /* rating e favoritas: única exceção ao "nunca usar localStorage" — aqui é seguro porque o
     resultado é um .html standalone entregue ao comprador, não um artifact do preview do chat. */
  rating: (function(){ try{ return parseInt(localStorage.getItem('app_rating')) || 0; }catch(e){ return 0; } })(),
};
function setRating(n){
  state.rating = n;
  try{ localStorage.setItem('app_rating', n); }catch(e){}
  if(state.route==='home') render();
  const modalEl = document.getElementById('ratingModal');
  if(modalEl && modalEl.classList.contains('open')) renderRatingModal();
}
function openRatingModal(){
  document.getElementById('ratingModal').classList.add('open');
  try{ localStorage.setItem('app_popup_seen','1'); }catch(e){}
  renderRatingModal();
}
function closeRatingModal(markDismissed){
  document.getElementById('ratingModal').classList.remove('open');
  if(markDismissed){ try{ localStorage.setItem('app_popup_seen','1'); }catch(e){} }
}
function renderRatingModal(){
  const r = state.rating;
  let thanksHtml = '';
  if(r >= 4){
    thanksHtml = `<div class="rc-thanks">Que alegria saber disso! 💛 Se puder, <b>comenta lá no anúncio</b> contando o que achou — isso ajuda outras mulheres a começarem a vender também.</div>`;
  } else if(r > 0){
    thanksHtml = `<div class="rc-thanks">Obrigada por avaliar! Sua opinião nos ajuda a melhorar o app a cada atualização. 💛</div>`;
  }
  document.getElementById('ratingModalContent').innerHTML = `
    <button class="rm-close" onclick="closeRatingModal(true)">✕</button>
    <div class="rc-icon">⭐</div>
    <h3 style="font-family:'Fraunces',serif;font-size:20px;color:var(--forest);margin-bottom:8px;">O que você achou do app?</h3>
    <p style="font-size:13.5px;color:var(--ink-soft);line-height:1.55;margin-bottom:16px;">Sua avaliação ajuda a gente a deixar o app cada vez melhor pra você vender mais.</p>
    <div class="rc-stars">
      ${[1,2,3,4,5].map(n=>`<button class="rc-star ${n<=r?'filled':''}" onclick="setRating(${n})">${n<=r?'★':'☆'}</button>`).join('')}

/* Gera um PDF da receita a partir da área imprimível do cartão usando html2canvas + jsPDF.
   Espera as fontes e a foto carregarem antes de fotografar — sem isso o PDF às vezes sai
   com a fonte padrão do navegador ou sem imagem. */
function waitForCardAssets(area, timeout){
  const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  const imgs = Array.from(area.querySelectorAll('img'));
  const imagesReady = imgs.length
    ? Promise.all(imgs.map(img=> img.complete ? Promise.resolve() : new Promise(res=>{ img.onload = img.onerror = res; })))
    : Promise.resolve();
  return Promise.race([
    Promise.all([fontsReady, imagesReady]),
    new Promise(res=>setTimeout(res, timeout || 4000))
  ]);
}
async function downloadRecipePDF(printId, btnId, recipeName){
  const area = document.getElementById(printId);
  const btn = document.getElementById(btnId);
  if(!area) return;
  const originalLabel = btn ? btn.innerHTML : '';
  if(typeof html2canvas === 'undefined' || !window.jspdf){ window.print(); return; }
  if(btn){ btn.disabled = true; btn.innerHTML = '⏳ Preparando...'; }
  try{
    await waitForCardAssets(area, 4000);
    if(btn){ btn.innerHTML = '⏳ Gerando PDF...'; }
    const canvas = await html2canvas(area, {scale:3, useCORS:true, allowTaint:true, backgroundColor:'#FFF8F0'});
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageWidth = 210, pageHeight = 297, margin = 10;
    const imgWidth = pageWidth - margin*2;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    let heightLeft = imgHeight;
    let position = margin;
    const imgData = canvas.toDataURL('image/jpeg', 0.97);
    pdf.addImage(imgData, 'JPEG', margin, position, imgWidth, imgHeight);
    heightLeft -= (pageHeight - margin*2);
    while(heightLeft > 0){
      position = heightLeft - imgHeight + margin;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', margin, position, imgWidth, imgHeight);
      heightLeft -= (pageHeight - margin*2);
    }
    const safeName = (recipeName||'receita').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'');
    pdf.save((safeName || 'receita') + '.pdf');
  }catch(err){
    alert('Não foi possível gerar o PDF agora. Você pode tentar de novo, ou usar a opção de imprimir do navegador.');
  }finally{
    if(btn){ btn.disabled = false; btn.innerHTML = originalLabel; }
  }
}

/* ---------------- FERRAMENTAS DE VENDA ----------------
   Igual ao app do Rolinhos: o estado vive em memória e só ESPELHA no localStorage.
   Se o armazenamento falhar (aba anônima, dados bloqueados), tudo continua funcionando na
   sessão; só não lembra amanhã. */
function lerSalvo(chave, padrao){
  try{ const v = JSON.parse(localStorage.getItem(chave)); if(v && typeof v === "object") return Object.assign(JSON.parse(JSON.stringify(padrao)), v); }catch(e){}
  return JSON.parse(JSON.stringify(padrao));
}
function salvar(chave, valor){ try{ localStorage.setItem(chave, JSON.stringify(valor)); }catch(e){} }
const reais = (v)=> "R$ " + (Math.round(v*100)/100).toLocaleString("pt-BR",{minimumFractionDigits:2, maximumFractionDigits:2});
function numero(v, padrao){ const n = Number(String(v).replace(",", ".")); return (v === "" || v === null || v === undefined || isNaN(n)) ? padrao : n; }
function todosSabores(){ return [...RECIPES.filter(r=>r.cat!=="massa"), ...Object.values(BONUS_RECIPES).flat()]; }
function precoPadrao(r){ return numero(String(r.preco||"").replace(/[^\d,]/g,""), 30); }
function custoRecheioPadrao(r){ const total = numero(String(r.custo||"").replace(/[^\d,]/g,""), 6); return Math.max(0, total - 2.55); } /* o custo da ficha já soma massa (R$ 2,40) e saco (R$ 0,15) */

function saborPorId(id){ return todosSabores().find(r=>r.id===Number(id)); }
function totaisSemana(){
  let paes=0, faturado=0, recebido=0, custo=0;
  vendas.pedidos.forEach(p=>{
    const r = saborPorId(p.sabor); const q = numero(p.qtd,1); const v = numero(p.valor,30)*q;
    paes += q; faturado += v; if(p.pago) recebido += v; custo += (r ? custoPao(r) : 6)*q;
  });
  return {paes, faturado, recebido, aReceber: faturado-recebido, custo, lucro: faturado-custo};
}
function addPedido(){
  const nome = document.getElementById("vd-cliente").value.trim();
  const sabor = document.getElementById("vd-sabor").value;
  const qtd = Math.max(1, Math.round(numero(document.getElementById("vd-qtd").value, 1)));
  const r = saborPorId(sabor);
  if(!nome){ document.getElementById("vd-cliente").focus(); return; }
  vendas.pedidos.unshift({id:Date.now(), cliente:nome, sabor:Number(sabor), qtd, valor: r ? precoVenda(r) : 30, pago:false, entregue:false});
  guardaVendas(); render();
}

    </div>
    ${vendas.pedidos.length ? `<div class="vd-lista">${linhas}</div>
      <div class="pl-acoes"><button class="btn-outline" onclick="copiarResumo(this)">📋 Copiar a lista de produção</button><button class="btn-outline" id="vd-fechar" onclick="fecharSemana()">Fechar a semana</button></div>`
      : `<div class="empty-state" style="padding:26px 10px"><div class="big">🥖</div><p>Nenhum pedido anotado ainda.<br>Mande o cardápio com a mensagem 1 do bônus 2.</p></div>`}
    <div class="quick-action-card" style="margin-top:14px" onclick="openFolha()">
      <div class="qa-icon">🧾</div>
      <div class="qa-text"><b>A folha de preço</b><span>Quanto custa, por quanto vender e quanto sobra em cada sabor</span></div>
      <span class="qa-arrow">→</span>
    </div>
    ${historico?`<div class="fornada-conta"><h3>As semanas fechadas</h3>${historico}</div>`:''}
  </div>`;
}

/* ===== A CONTA DA FORNADA (tela de cada fornada pronta) ===== */
function contaFornada(c){
  const ids = MEAL_ORDER.map(m=>c.meals[m]);
  const sab = ids.map(id=>RECIPES.find(r=>r.id===id)).filter(Boolean);
  const fat = sab.reduce((s,r)=>s + precoVenda(r)*10, 0);
  const custo = sab.reduce((s,r)=>s + custoPao(r)*10, 0);
  return `<div class="fornada-conta">
    <h3>A conta desta fornada</h3>
    <div class="fc-row"><span>5 sabores, 10 pães de cada</span><b>50 pães</b></div>
    <div class="fc-row"><span>Vendendo todos ao seu preço</span><b>${reais(fat)}</b></div>
    <div class="fc-row"><span>O que você gasta pra fazer</span><b>${reais(custo)}</b></div>
    <div class="fc-row total"><span>Sobra de lucro num dia de massa</span><b>${reais(fat-custo)}</b></div>
    <p style="font-size:12px;color:var(--ink-soft);margin:12px 0 0;line-height:1.5;">Conta feita com os preços da sua <a onclick="openFolha()" style="color:var(--forest);font-weight:700;cursor:pointer">folha de preço</a>. Ajuste lá pro que você paga e cobra na sua cidade.</p>
  </div>`;
}

/* ===== QUEM ESTÁ POR TRÁS ===== */
function expertSection(){
  return `<div class="expert-card">
    <img src="${EXPERT_IMG}" alt="Chef Mari Dias" loading="lazy" onerror="this.remove()">
    <div><div class="eyebrow">QUEM ESTÁ POR TRÁS</div><h3>Chef Mari Dias</h3>
    <p>Comecei vendendo o que todo mundo vendia e assava muito pra sobrar pouco. Quando passei a fazer a massa num dia só e assar só o que já estava pago, a conta fechou. Coloquei aqui o que faço no dia a dia.</p></div>
  </div>`;
}

/* ---------------- LISTA DE COMPRAS ---------------- */
function openListModal(){ document.getElementById('listModal').classList.add('open'); renderModal(); }
function closeListModal(){ document.getElementById('listModal').classList.remove('open'); render(); }
function clearListSelection(){ state.listSelected.clear(); renderModal(); }
function setModalSearch(v){ state.listModalSearch=v; renderModal(); }
function setModalFilter(f){ state.listModalFilter=f; renderModal(); }
function toggleListSelect(id){
  state.listSelected.has(id) ? state.listSelected.delete(id) : state.listSelected.add(id);
  renderModal();
}
function renderModal(){
  const filters = ['todas', ...Object.keys(CATS)];
  document.getElementById('modalFilters').innerHTML = filters.map(f=>{
    const count = f==='todas' ? RECIPES.length : RECIPES.filter(r=>r.cat===f).length;
    const label = f==='todas' ? 'Todas' : CATS[f].label;
    return `<button class="pill ${state.listModalFilter===f?'active':''}" onclick="setModalFilter('${f}')">${label} (${count})</button>`;
  }).join('');
  const list = RECIPES.filter(r=>{
    const matchCat = state.listModalFilter==='todas' ? true : r.cat===state.listModalFilter;
    const matchSearch = (r.name.toLowerCase()+r.ingredients.join(' ').toLowerCase()).includes(state.listModalSearch.toLowerCase());
    return matchCat && matchSearch;
  });
  document.getElementById('modalGrid').innerHTML = `<div class="modal-grid">${list.map(r=>{
    const sel = state.listSelected.has(r.id);
    const art = r.img
      ? `<img src="${r.img}" alt="${r.name}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;" onerror="this.replaceWith(Object.assign(document.createElement('div'),{style:'font-size:34px',textContent:'${r.icon}'}))">`
      : r.icon;
    return `<div class="modal-card ${sel?'selected':''}" onclick="toggleListSelect(${r.id})">
      <div class="modal-art" style="${artStyle(r.cat)}">${art}<div class="modal-check">✓</div></div>
      <div class="modal-info">
        <div class="modal-cat" style="color:${CATS[r.cat].color}">${CATS[r.cat].label}</div>
        <div class="modal-name">${r.name}</div>
      </div>
    </div>`;
  }).join('') || '<div class="empty-state" style="grid-column:1/-1"><div class="big">🍽️</div><p>Nenhuma receita encontrada.</p></div>'}</div>`;
  document.getElementById('modalCount').textContent = `${state.listSelected.size} receita${state.listSelected.size===1?'':'s'} selecionada${state.listSelected.size===1?'':'s'}`;
}
function normalizeIng(str){ return str.trim().toLowerCase().replace(/\s+/g,' '); }
function generateShoppingList(){
  const chosen = RECIPES.filter(r=>state.listSelected.has(r.id));
  const seen = new Map();
  chosen.forEach(r=>{
    r.ingredients.forEach(ing=>{
      const key = normalizeIng(ing);
      if(!seen.has(key)) seen.set(key, {text:ing, from:new Set()});
      seen.get(key).from.add(r.name);
    });
  });
  state.generatedList = Array.from(seen.values()).sort((a,b)=>a.text.localeCompare(b.text,'pt-BR'));
  state.checkedItems = new Set();
  render();
}
function toggleChecked(idx){
  state.checkedItems.has(idx) ? state.checkedItems.delete(idx) : state.checkedItems.add(idx);
  render();
}
function resetList(){ state.generatedList=null; render(); }
function listaSection(){
  if(!state.generatedList){
    const n = state.listSelected.size;
    return `
      <div class="list-summary">
        <div class="list-cart-icon">🛒</div>
        <h2>${n>0?`${n} receita${n===1?'':'s'} selecionada${n===1?'':'s'}`:'Nenhuma receita selecionada'}</h2>
        <p>${n>0?'Pronta pra gerar sua lista de compras.':'Escolha os sabores da semana e o app soma os ingredientes do dia da massa.'}</p>
        <div class="list-summary-actions">
          <button class="btn-outline" onclick="openListModal()">+ Ajustar receitas</button>
          <button class="btn-terracotta" ${n===0?'disabled':''} onclick="${n>0?'generateShoppingList()':''}">Gerar lista</button>
        </div>
      </div>`;
  }
  const total = state.generatedList.length;
  const done = state.checkedItems.size;
  return `
    <div class="list-header">
      <div>
        <a class="back-link" onclick="resetList()">← Nova lista</a>
        <h1>Sua lista de compras</h1>
        <div class="list-progress">${done} DE ${total} ITENS MARCADOS · ${state.listSelected.size} RECEITAS</div>
      </div>
      <div class="list-actions">
        <button class="btn-outline" onclick="openListModal()">+ Ajustar receitas</button>
      </div>
    </div>
    <div class="list-groups">
      <div class="list-items">
        ${state.generatedList.map((item,idx)=>{
          const checked = state.checkedItems.has(idx);
          const fromLabel = item.from.size>1 ? `${item.from.size} receitas` : Array.from(item.from)[0];
          return `<div class="list-item ${checked?'checked':''}" onclick="toggleChecked(${idx})">
            <div class="box">${checked?'✓':''}</div>
            <span class="txt">${item.text}</span>
            <span class="from">${fromLabel}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}
function setFilter(f){ state.filter=f; render(); }
function setSearch(v){ state.search=v; render(); keepFocus('searchInput'); }
function render(){
  const app = document.getElementById('app');
  if(state.route==='home') app.innerHTML = heroSection();
  else if(state.route==='recipes') app.innerHTML = recipesSection();
  else if(state.route==='detail') app.innerHTML = detailSection();
  else if(state.route==='lista') app.innerHTML = listaSection();
  else if(state.route==='bonusList') app.innerHTML = bonusListSection();
  else if(state.route==='bonusDetail') app.innerHTML = bonusDetailSection();
  else if(state.route==='guide') app.innerHTML = guideSection();
  else if(state.route==='cardapios') app.innerHTML = cardapiosSection();
  else if(state.route==='cardapioDetail') app.innerHTML = cardapioDetailSection();
  else if(state.route==='fotos') app.innerHTML = fotosSection();
  else if(state.route==='vendas') app.innerHTML = vendasSection();
  else if(state.route==='folha') app.innerHTML = folhaSection();
  else if(state.route==='cert') app.innerHTML = certSection();
}
setRoute('home');
/* Botão de voltar ao topo: aparece só depois que a rolagem passa da primeira tela. */
(function(){
  const b = document.getElementById('toTop');
  if(!b) return;
  const upd = () => b.classList.toggle('show', window.scrollY > 600);
  window.addEventListener('scroll', upd, {passive:true});
  upd();
})();
/* Popup de avaliação: aparece uma única vez, depois de um tempinho navegando,
   só se a pessoa ainda não avaliou nem fechou o popup antes. */
(function(){
  let jaVisto = false;
  try{ jaVisto = localStorage.getItem('app_popup_seen') === '1'; }catch(e){}
  if(!jaVisto && state.rating === 0){
    setTimeout(()=>{ if(state.rating === 0) openRatingModal(); }, 12000);
  }
})();
</script>
