<style>
:root{--bg:#FBF3EA;--bg2:#F3E2D0;--card:#FFFAF4;--brown:#9D5126;--brown-d:#6D3515;--ink:#3F2316;--soft:#735E50;--terra:#B95E17;--terra-d:#8A4210;--sage:#2F8F5A;--sage-l:#FBE3D6;--line:rgba(109,53,21,.14);--r:18px;--sh:0 6px 20px -10px rgba(109,53,21,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:84px}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;margin:0;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.top{position:sticky;top:0;z-index:30;background:var(--brown);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px calc(12px) 16px}
.top .logo{font-family:'Fraunces',serif;font-weight:700;font-size:18px;flex:1}
.top .back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:18px;display:none}
.top.has-back .back{display:block}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 24px}
.hello{font-size:13px;color:var(--soft);font-weight:600}
.hello b{color:var(--brown-d)}
.hero{background:linear-gradient(135deg,var(--brown),var(--brown-d));color:#fff;border-radius:24px;padding:22px 20px;display:grid;grid-template-columns:1fr;gap:12px;align-items:center;box-shadow:var(--sh);margin:12px 0 18px}
.hero img{width:100%;max-width:300px;justify-self:center;border-radius:12px;background:transparent}
.hero h1{font-size:25px;line-height:1.1}.hero p{margin:6px 0 0;color:rgba(255,255,255,.85);font-size:14px;line-height:1.5}
.bar{height:8px;background:rgba(255,255,255,.22);border-radius:99px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:#F2CB8A;border-radius:99px}
.prog{font-size:12px;margin-top:6px;opacity:.9}
h2.sec{font-size:19px;margin:22px 0 10px;color:var(--brown-d)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s}
.card:active{transform:scale(.98)}
.card .art{aspect-ratio:1/1;background:radial-gradient(circle at 50% 40%,#fff,var(--bg2));display:flex;align-items:center;justify-content:center;position:relative}
.card .art svg{width:88%;height:88%}
.card .art img{width:100%;height:100%;object-fit:contain;padding:8px}
.card .tx{padding:10px 12px 12px;border-top:1px solid var(--line)}
.card .tt{font-weight:700;font-size:14px;line-height:1.2}
.card .st{font-size:11.5px;color:var(--soft);margin-top:4px}
.badge{position:absolute;top:8px;left:8px;background:var(--brown);color:#fff;font-size:10px;font-weight:800;padding:4px 9px;border-radius:99px;letter-spacing:.04em}
.badge.ok{background:var(--sage)}
.fav{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:10px;align-items:center;box-shadow:var(--sh);cursor:pointer}
.tile .ic{width:42px;height:42px;border-radius:50%;background:var(--sage-l);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.tile b{display:block;font-size:14px}.tile span{font-size:11.5px;color:var(--soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--soft)}
.chip.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.search{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:12px 16px;margin:10px 0}
.search input{border:0;outline:0;background:none;width:100%;font:inherit;font-size:14.5px;color:var(--ink)}
.rec-art{background:radial-gradient(circle at 50% 40%,#fff,var(--bg2));border-radius:24px;aspect-ratio:1/1;max-width:340px;margin:6px auto 14px;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh)}
.rec-art svg{width:90%;height:90%}
.rec h1{font-size:26px;text-align:center}
.meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.meta span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:12.5px;font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0 4px}
.btn{background:var(--terra);color:#fff;border-radius:99px;padding:12px 20px;font-weight:800;font-size:14px;box-shadow:0 8px 18px -10px var(--terra-d)}
.btn.sec{background:var(--card);color:var(--brown-d);border:1px solid var(--line);box-shadow:none}
.btn.ok{background:var(--sage)}
.btn[disabled]{opacity:.5}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0}
.box h3{font-size:17px;margin-bottom:10px;color:var(--brown-d)}
.fio{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}.fio:last-child{border:0}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);flex-shrink:0}
.fio b{margin-left:auto;font-variant-numeric:tabular-nums}
.mapa{display:flex;flex-wrap:wrap;gap:8px}.mapa span{background:var(--sage-l);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700}
.mapa span i{font-style:normal;background:var(--sage);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;margin-right:6px}
.parte h4{margin:0 0 8px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.parte h4 small{font-weight:600;color:var(--soft);font-size:12px}
.ln{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45;cursor:pointer}
.ln:last-child{border:0}
.ln .ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--sage);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.ln.on .ck{background:var(--sage)}.ln.on .t{text-decoration:line-through;color:var(--soft)}
ol.steps{margin:0;padding-left:0;list-style:none}ol.steps li{display:flex;gap:10px;padding:8px 0;font-size:14px;line-height:1.5}
ol.steps li i{font-style:normal;flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--terra);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.dica{background:#F9E3D6;border-radius:14px;padding:12px 14px;font-size:13.5px;margin-top:8px}
.note{font-size:12px;color:var(--soft);margin-top:10px;line-height:1.5}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--brown);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -8px 20px -10px rgba(0,0,0,.4)}
.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(255,255,255,.7);padding:6px 2px;border-radius:12px;font-size:10.5px;font-weight:700}
.bottom button i{font-style:normal;font-size:20px}
.bottom button.on{color:#fff;background:rgba(255,255,255,.14)}
.aula{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin:10px 0;cursor:pointer;box-shadow:var(--sh)}
.aula img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#ccc;flex-shrink:0}
.aula b{font-size:15px;display:block}.aula span{font-size:12px;color:var(--soft)}
.video{position:relative;padding-top:56.25%;border-radius:16px;overflow:hidden;background:#000;box-shadow:var(--sh)}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.nav2{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
table.pr{width:100%;border-collapse:collapse;font-size:13px}.pr th,.pr td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}.pr th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft)}.pr td.n{font-weight:800;color:var(--terra-d);white-space:nowrap}
.fld{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fld label{font-size:12px;font-weight:700;color:var(--soft);display:block}.fld input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-size:15px;margin-top:4px}
.msg{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0;font-size:14px;line-height:1.55}.msg small{display:block;color:var(--terra-d);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.msg .btn{margin-top:10px;padding:9px 16px;font-size:13px}
.etq{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.etq div{border:2px dashed var(--brown);border-radius:12px;padding:12px 8px;text-align:center;font-size:12px;background:#fff;min-height:84px;display:flex;flex-direction:column;justify-content:center}
.etq div b{font-family:'Fraunces',serif;font-size:14px}
.sheet{background:#fff;border-radius:14px;padding:14px;margin:12px 0;border:1px solid var(--line);overflow-x:auto}.sheet table{width:100%;border-collapse:collapse;font-size:12px;min-width:520px}.sheet td,.sheet th{border:1px solid #bbb;padding:9px 6px;height:30px}
.empty{text-align:center;color:var(--soft);padding:40px 10px}
.go-top{display:none}
@media print{.top,.bottom,.acts,.nav2,.no-print{display:none!important}body{background:#fff;padding:0}.sheet{border:0}}
</style>
</head>

const DADOS = {"cats": [{"id": 1, "nome": "Amigurumis", "emoji": "🧸"}, {"id": 2, "nome": "Para bebês", "emoji": "👶"}, {"id": 3, "nome": "Mesa posta", "emoji": "🍽️"}, {"id": 4, "nome": "Decoração da casa", "emoji": "🏡"}, {"id": 5, "nome": "Acessórios", "emoji": "💍"}, {"id": 6, "nome": "Para os pets", "emoji": "🐾"}, {"id": 7, "nome": "Roupas e moda", "emoji": "👗"}, {"id": 8, "nome": "Linha católica", "emoji": "✝️"}], "itens": [{"id": 1, "nome": "Animais Amigurumi", "cat": 1, "emoji": "🧸"}, {"id": 2, "nome": "Bonecas Amigurumi", "cat": 1, "emoji": "🧸"}, {"id": 3, "nome": "Ursinhos Amigurumi", "cat": 1, "emoji": "🧸"}, {"id": 4, "nome": "Chaveiros Amigurumi", "cat": 1, "emoji": "🧸"}, {"id": 5, "nome": "Amigurumi para Bebês", "cat": 1, "emoji": "🧸"}, {"id": 6, "nome": "Roupinhas para Bebês", "cat": 2, "emoji": "👶"}, {"id": 7, "nome": "Jogo Americano", "cat": 3, "emoji": "🍽️"}, {"id": 8, "nome": "Porta Copos", "cat": 3, "emoji": "🍽️"}, {"id": 9, "nome": "Descanso de Panela", "cat": 3, "emoji": "🍽️"}, {"id": 10, "nome": "Centros de Mesa", "cat": 3, "emoji": "🍽️"}, {"id": 11, "nome": "Sousplat", "cat": 3, "emoji": "🍽️"}, {"id": 12, "nome": "Tapetes", "cat": 4, "emoji": "🏡"}, {"id": 13, "nome": "Tapetes para Banheiro", "cat": 4, "emoji": "🏡"}, {"id": 14, "nome": "Capas de Almofada", "cat": 4, "emoji": "🏡"}, {"id": 15, "nome": "Brincos", "cat": 5, "emoji": "💍"}, {"id": 16, "nome": "Colares", "cat": 5, "emoji": "💍"}, {"id": 17, "nome": "Pulseiras", "cat": 5, "emoji": "💍"}, {"id": 18, "nome": "Bolsas", "cat": 5, "emoji": "💍"}, {"id": 19, "nome": "Roupas para Cachorro", "cat": 6, "emoji": "🐾"}, {"id": 20, "nome": "Roupas para Gatos", "cat": 6, "emoji": "🐾"}, {"id": 21, "nome": "Croppeds", "cat": 7, "emoji": "👗"}, {"id": 22, "nome": "Mantas para Sofá", "cat": 4, "emoji": "🏡"}, {"id": 23, "nome": "Biquínis", "cat": 7, "emoji": "👗"}, {"id": 24, "nome": "Cestos", "cat": 4, "emoji": "🏡"}, {"id": 25, "nome": "Capas de Bíblia", "cat": 8, "emoji": "✝️"}, {"id": 26, "nome": "Brincos Católicos", "cat": 8, "emoji": "✝️"}, {"id": 27, "nome": "Colares Católicos", "cat": 8, "emoji": "✝️"}, {"id": 28, "nome": "Almofadas Católicas", "cat": 8, "emoji": "✝️"}, {"id": 29, "nome": "Sousplat Católico", "cat": 8, "emoji": "✝️"}, {"id": 30, "nome": "Jogo Americano Católico", "cat": 8, "emoji": "✝️"}, {"id": 31, "nome": "Tapetes Católicos", "cat": 8, "emoji": "✝️"}, {"id": 32, "nome": "Bonés", "cat": 7, "emoji": "👗"}, {"id": 33, "nome": "Calças", "cat": 7, "emoji": "👗"}, {"id": 34, "nome": "Shorts", "cat": 7, "emoji": "👗"}, {"id": 35, "nome": "Camisetas", "cat": 7, "emoji": "👗"}, {"id": 36, "nome": "Ponchos", "cat": 7, "emoji": "👗"}, {"id": 37, "nome": "Camisa Social Masculina", "cat": 7, "emoji": "👗"}, {"id": 38, "nome": "Vestidos", "cat": 7, "emoji": "👗"}, {"id": 39, "nome": "Casacos", "cat": 7, "emoji": "👗"}, {"id": 40, "nome": "Cardigans", "cat": 7, "emoji": "👗"}, {"id": 41, "nome": "Saídas de Praia", "cat": 7, "emoji": "👗"}, {"id": 42, "nome": "Sapatinhos de Bebê", "cat": 2, "emoji": "👶"}, {"id": 43, "nome": "Marcadores de Página", "cat": 5, "emoji": "💍"}, {"id": 44, "nome": "Terços", "cat": 8, "emoji": "✝️"}], "pdfs": {"7": "pdfs/12-jogos-americanos-em-croche.pdf", "8": "pdfs/12-porta-copos-em-croche.pdf", "9": "pdfs/12-descansos-de-panela-em-croche.pdf", "10": "pdfs/12-centros-de-mesa-em-croche.pdf", "11": "pdfs/12-sousplats-em-croche.pdf"}};
const SABER = [{"p": "O anel mágico abre quando eu puxo o fio. O que fazer?", "r": "Depois de fazer os 6 pontos baixos, puxe o fio solto até o anel fechar por completo. Em seguida, faça um nó com as duas pontas, ou passe o fio por dentro de 2 a 3 pontos antes de cortar. Não corte rente: deixe 5 cm."}, {"p": "Como sei onde termina cada volta?", "r": "Use um marcador de ponto no primeiro ponto da volta. Ao chegar nele, mova o marcador para o primeiro ponto da volta nova. Contar os pontos no fim de cada volta também ajuda: o total está escrito ao lado da volta, entre parênteses."}, {"p": "Como ler (2 pb, aum) x6?", "r": "Quer dizer: faça 2 pontos baixos, depois 1 aumento (2 pontos baixos no mesmo ponto), e repita isso 6 vezes na volta. No fim da volta, o total de pontos bate com o número entre parênteses."}, {"p": "A minha volta ficou com pontos a mais ou a menos.", "r": "Conte a volta antes de seguir. Se faltou ou sobrou, desmanche essa volta e refaça com calma. Uma volta errada vira uma peça torta. Use o marcador e conte de 6 em 6."}, {"p": "A peça ficou torta ou espiralada.", "r": "Em amigurumi em espiral isso é normal: a volta sobe levemente. Para endireitar, aperte um pouco o fio e esconda o início da volta no lado de trás da peça."}, {"p": "Dá para ver o enchimento entre os pontos.", "r": "O fio está largo para a agulha. Use agulha um número menor (2,0 mm), ou segure o fio mais firme. Cor de enchimento clara em peça escura também aparece, então use enchimento da cor do fio, quando puder."}, {"p": "Quanto de enchimento devo colocar?", "r": "Encha em camadas pequenas, empurrando primeiro para as pontas. A peça deve ficar firme ao toque, sem marcar o ponto. Se amassar muito fácil, falta enchimento; se os pontos abrirem, é demais."}, {"p": "Como trocar de cor sem ficar feio?", "r": "Termine o último ponto da cor antiga puxando a nova cor no último laço. Passe a ponta antiga por dentro da peça. Faça a troca sempre no primeiro ponto da volta."}, {"p": "Como escondo as   <div class="note">${CT.pontos>0?CT.pontos+' pontos por carreira · '+fd+' pontos feitos':'Preencha os pontos por carreira para ver o total feito'}</div></div>
  <div class="box"><div class="fld"><div><label>Meta de carreiras<input type="number" inputmode="numeric" min="0" value="${CT.meta}" onchange="CT.meta=Number(this.value)||0;ctSave();draw(true)"></label></div><div><label>Pontos por carreira<input type="number" inputmode="numeric" min="0" value="${CT.pontos}" onchange="CT.pontos=Number(this.value)||0;ctSave();draw(true)"></label></div></div>
  <div style="margin-top:14px;font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--soft)">PROGRESSO · ${pct}%</div><div class="bar" style="background:var(--bg2)"><i style="width:${pct}%;background:var(--sage)"></i></div>
  <div class="acts no-print" style="margin-top:14px"><button class="btn sec" onclick="if(confirm('Zerar o contador?')){CT.carreira=0;ctSave();draw(true)}">Zerar contador</button></div></div>
  <div class="note">Dica: no PDF de cada material, a contagem de cada volta mostra quantos pontos ela leva. Use esse número em "Pontos por carreira".</div>`}
function draw(keep,focusId){
  const r=rota; let h='';
  const m={home:()=>home(),materiais:()=>materiais(),cat:()=>categoria(r.p),item:()=>item(r.p),favoritos:()=>favoritos(),ferramentas:()=>ferramentas(),assistente:()=>assistente(),comunidade:()=>comunidade(),acabamento:()=>acabamento(),precos:()=>precos(),papelaria:()=>papelaria(),mensagens:()=>mensagens(),contador:()=>contador()};
  h=(m[r.r]||m.home)();
  const y=window.scrollY;$app.innerHTML=h;
  $top.classList.toggle('has-back',r.r!=='home');
  const tab={home:'home',materiais:'materiais',cat:'materiais',item:'materiais',favoritos:'materiais'}[r.r]||(r.r==='comunidade'?'comunidade':'ferramentas');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.r===tab));
  if(keep)window.scrollTo(0,y);
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus();const v=el.value;try{el.setSelectionRange(v.length,v.length)}catch(e){}}}
}
draw();
</script>
